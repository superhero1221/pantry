<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf3" />
    <meta
      name="description"
      content="Tell it what you fancy and what's in your pocket. Pantry picks one dish, prices it where you are, and walks you through cooking it. No account needed."
    />
    <title>Pantry — one decision at a time, priced where you actually stand</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />

    <!-- The site answers on both the apex and www. This says which one is the
         real address, so the two spellings are not counted as two sites. It
         must agree with Netlify's primary domain setting. -->
    <link rel="canonical" href="https://pantryglobe.com/" />

    <!-- Ownership, machine-readable. `rel="license"` is the one a crawler or an
         archiver actually looks for; the two meta names are ignored by search
         engines and are here because they are what a person reads when they
         open the source of a page they are thinking of copying. -->
    <link rel="license" href="/LICENSE" />
    <meta name="author" content="the Pantry authors" />
    <meta name="copyright" content="Copyright © 2026 the Pantry authors. All rights reserved." />

    <!-- What a pasted link looks like. og:image has to be an absolute URL —
         scrapers do not resolve relative ones reliably — so it names the
         production host even on the GitHub Pages mirror. The PNG is built by
         scripts/make-og-image.mjs and committed; it is never fetched by the app.
         No hreflang: that needs one URL per language, and the whole point of a
         hash router is that there is one URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pantry" />
    <meta property="og:url" content="https://pantryglobe.com/" />
    <meta property="og:title" content="Pantry — one decision at a time, priced where you actually stand" />
    <meta
      property="og:description"
      content="Tell it what you fancy and what's in your pocket. Pantry picks one dish, prices it where you are, and walks you through cooking it. No account needed."
    />
    <meta property="og:image" content="https://pantryglobe.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pantry — tell it what you fancy and what's in your pocket. One decision at a time, priced where you actually stand."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="ur_PK" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- X falls back to the og:* tags for everything but the card type. The
         rest is spelled out because other scrapers read twitter:* first. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pantry — one decision at a time, priced where you actually stand" />
    <meta
      name="twitter:description"
      content="Tell it what you fancy and what's in your pocket. Pantry picks one dish, prices it where you are, and walks you through cooking it. No account needed."
    />
    <meta name="twitter:image" content="https://pantryglobe.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="Pantry — tell it what you fancy and what's in your pocket. One decision at a time, priced where you actually stand."
    />
    <!-- Served from this origin, not from Google. The design's typography no
         longer depends on a third party being reachable, the woff2 files are
         preloaded so text paints once rather than twice, and no visitor's IP
         goes to a CDN to read a recipe. -->
    <link rel="preload" href="/fonts/caprasimo-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root">
      <!-- React clears this on mount. It is here for the two cases where that
           never happens: a crawler that does not run JavaScript, and a visitor
           whose bundle failed to load, who otherwise gets a white page and no
           explanation. This is the one place copy is hardcoded rather than
           living in extra-copy.ts, and it is English only, because this exists
           precisely for the moment the file holding the six languages has not
           been parsed. Keep it true and keep it short. -->
      <div
        id="fallback"
        style="max-width:22rem;margin:0 auto;padding:2.5rem 1.6rem;font-family:Figtree,system-ui,sans-serif;color:#3b3229"
      >
        <h1 style="font-family:Caprasimo,Georgia,serif;font-weight:400;font-size:2.6rem;margin:0">Pantry</h1>
        <p style="font-size:1.1rem;line-height:1.45;margin:1rem 0 0">
          Tell it what you fancy and what's in your pocket. One decision at a time,
          priced where you actually stand.
        </p>
        <p style="font-size:.95rem;line-height:1.5;margin:1.2rem 0 0;color:#847462">
          Pantry needs JavaScript to run. If you can see this with JavaScript switched
          on, the app failed to load — reloading usually fixes it.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
