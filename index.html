<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ead8" />
    <meta
      name="description"
      content="Pantry — tell it what you fancy and what's in your pocket. One decision at a time, priced where you actually stand."
    />
    <title>Pantry</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <!-- Served from this origin, not from Google. The design's typography no
         longer depends on a third party being reachable, the woff2 files are
         preloaded so text paints once rather than twice, and no visitor's IP
         goes to a CDN to read a recipe. -->
    <link rel="preload" href="/fonts/caprasimo-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
