<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pantry</title>
<style>
/* Two screens, no settings, no explanations. If something needs a paragraph
   to justify it, it should not be on the screen. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#111; background:#fff;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}

.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.top{padding:28px 0 16px}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:640}

.search{
  width:100%;margin:18px 0 26px;padding:13px 15px;
  border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px;
}
.search:focus{outline:none;border-color:#111}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;padding-bottom:44px}
.card img,.card .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#f2f2f0}
.card h2{font-size:15px;line-height:1.3;margin:9px 0 2px;font-weight:560;letter-spacing:-.01em}
.card p{font-size:13px;color:#777;margin:0}

/* dish */
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2f2f0}
.back{
  position:fixed;top:14px;left:14px;z-index:6;
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.22);
}
h2.name{font-size:23px;line-height:1.2;letter-spacing:-.02em;margin:22px 0 0;font-weight:640}
.facts{display:flex;gap:26px;margin:14px 0 26px;font-size:14px;color:#666}
.facts b{display:block;font-size:19px;color:#111;font-weight:620;letter-spacing:-.01em}

.rule{height:1px;background:#e8e8e6;margin:0}
.fade{position:fixed;top:0;left:0;right:0;height:62px;z-index:5;pointer-events:none;
  background:linear-gradient(#fff 32%,rgba(255,255,255,0));opacity:0;transition:opacity .18s}
.fade.on{opacity:1}
h3{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:#888;
   font-weight:600;margin:30px 0 14px}

.serv{display:flex;align-items:center;gap:14px;margin:0 0 20px}
.serv span{font-size:15px;color:#555;flex:1}
.serv button{width:34px;height:34px;border:1px solid #ddd;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#111}
.serv b{min-width:18px;text-align:center;font-weight:620;font-size:17px}

ul.buy{list-style:none;margin:0;padding:0}
ul.buy li{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid #f0f0ee}
ul.buy .n{flex:1;min-width:0;font-size:15px}
ul.buy .n small{display:block;color:#888;font-size:13px;margin-top:1px}
ul.buy .q{color:#777;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

.total{display:flex;justify-content:space-between;align-items:baseline;
  padding:20px 0 6px;font-size:17px;font-weight:620}
.total span:last-child{font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:#999;margin:0 0 4px}

ol.cook{list-style:none;margin:0;padding:0;counter-reset:s}
ol.cook li{counter-increment:s;position:relative;padding:0 0 22px 34px;font-size:15.5px;line-height:1.62}
ol.cook li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:23px;height:23px;border-radius:50%;background:#111;color:#fff;
  font-size:12px;font-weight:640;display:flex;align-items:center;justify-content:center;
}
ol.cook li.done{color:#aaa}
ol.cook li.done::before{background:#d8d8d5;color:#fff}

.end{padding:34px 0 60px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="fade"></div>
<div id="app"></div>
<script>/*__ENGINE__*/</script>
<script>
(function(){
'use strict';
var app=document.getElementById('app');

/* Country from the phone's own region. No picker: nobody opens a cooking app
   wanting to choose a currency. */
function guessCountry(){
  try{
    var l=navigator.languages||[navigator.language||''];
    for(var i=0;i<l.length;i++){
      var m=/[-_]([A-Za-z]{2})$/.exec(l[i]);
      if(m&&PG.COUNTRIES[m[1].toUpperCase()]) return m[1].toUpperCase();
    }
  }catch(e){}
  return 'GB';
}
var C=PG.getCountry(guessCountry());

var S={dish:null,servings:2,q:'',done:{}};

var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

function img(cls,src,remote,alt){
  if(!src) return '<div class="'+cls+'"></div>';
  return '<img class="'+cls+'" loading="lazy" decoding="async" alt="'+esc(alt||'')+'"'
    + ' src="'+esc(src)+'"'
    + (remote?' onerror="this.onerror=null;this.src=\''+esc(remote)+'\'"':'')+'>';
}

/* ------------------------------------------------------------------ list -- */
function list(){
  var q=S.q.trim().toLowerCase();
  var rs=PG.RECIPES.filter(function(r){
    if(!q) return true;
    return (r.name+' '+(r.localName||'')+' '+r.cuisine).toLowerCase().indexOf(q)>=0;
  });
  var h='<div class="wrap"><div class="top"><h1>What are you<br>cooking?</h1>'
    + '<input class="search" id="q" placeholder="Search" value="'+esc(S.q)+'"'
    + ' autocapitalize="none" autocorrect="off" spellcheck="false"></div><div class="grid">';
  rs.forEach(function(r){
    h+='<button class="card" data-id="'+r.id+'">'
      + img('', PG.dishPhoto(r.id), PG.DISH_REMOTE[r.id], r.name)
      + '<h2>'+esc(r.name.replace(/\s*\(.*\)$/,''))+'</h2>'
      + '<p>'+r.totalMin+' min</p></button>';
  });
  if(!rs.length) h+='<p style="color:#888;grid-column:1/-1">Nothing matches.</p>';
  return h+'</div></div>';
}

/* ------------------------------------------------------------------ dish -- */
function dish(r){
  var b=PG.priceBasket(r.items,C,1,S.servings,r.servings,new Set());
  var n=PG.nutrition(r.items,r.servings);
  var scale=S.servings/Math.max(r.servings,1);

  var h='<button class="back" id="back" aria-label="Back">&#8249;</button>'
    + img('hero', PG.dishPhoto(r.id), PG.DISH_REMOTE[r.id], r.name)
    + '<div class="wrap"><h2 class="name">'+esc(r.name.replace(/\s*\(.*\)$/,''))+'</h2>'
    + '<div class="facts">'
    +   '<div><b>'+r.totalMin+'</b>minutes</div>'
    +   '<div><b>'+Math.round(n.kcal)+'</b>calories</div>'
    +   '<div><b>'+Math.round(n.protein)+'g</b>protein</div>'
    + '</div><div class="rule"></div>'
    + '<h3>Buy</h3>'
    + '<div class="serv"><span>For '+S.servings+' '+(S.servings===1?'person':'people')+'</span>'
    +   '<button id="less">&minus;</button><b>'+S.servings+'</b><button id="more">+</button></div>'
    + '<ul class="buy">';

  b.items.slice().sort(function(a,z){return z.grams-a.grams}).forEach(function(it){
    var g=it.grams;
    var amount = g>=1000 ? (g/1000).toFixed(g%1000?1:0)+' kg'
               : g>=10   ? Math.round(g)+' g'
               : g<1     ? '&lt;1 g' : g.toFixed(1)+' g';
    h+='<li><span class="n">'+esc(it.name)
      + (it.note?'<small>'+esc(it.note)+'</small>':'')+'</span>'
      + '<span class="q">'+amount+'</span></li>';
  });

  h+='</ul><div class="total"><span>About</span><span>'
    + esc(PG.fmtMoney(b.marginal,C))+'</span></div>'
    + '<p class="fine">Estimated — prices vary by shop.</p>'
    + '<h3>Cook</h3><ol class="cook">';

  r.method.forEach(function(m,i){
    h+='<li class="'+(S.done[i]?'done':'')+'" data-step="'+i+'">'+esc(m.text)+'</li>';
  });

  h+='</ol><p class="end">Serves '+S.servings+'.</p></div>';
  return h;
}

/* ----------------------------------------------------------------- paint -- */
function render(keepScroll){
  var y=window.scrollY;
  var r=S.dish?PG.RECIPES.find(function(x){return x.id===S.dish}):null;
  app.innerHTML=r?dish(r):list();

  if(!r){
    var q=document.getElementById('q');
    q.addEventListener('input',function(){
      S.q=q.value;
      var g=document.querySelector('.grid');
      var tmp=document.createElement('div');
      tmp.innerHTML=list();
      g.innerHTML=tmp.querySelector('.grid').innerHTML;
      wireCards();
    });
    wireCards();
    window.scrollTo(0,0);
  }else{
    document.getElementById('back').onclick=function(){S.dish=null;S.done={};render()};
    document.getElementById('less').onclick=function(){
      if(S.servings>1){S.servings--;render(true)} };
    document.getElementById('more').onclick=function(){
      if(S.servings<12){S.servings++;render(true)} };
    Array.prototype.forEach.call(document.querySelectorAll('ol.cook li'),function(li){
      li.onclick=function(){
        var i=li.getAttribute('data-step');
        S.done[i]=!S.done[i];
        li.className=S.done[i]?'done':'';
      };
    });
    if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
  }
}

function wireCards(){
  Array.prototype.forEach.call(document.querySelectorAll('.card'),function(b){
    b.onclick=function(){
      S.dish=b.getAttribute('data-id');
      var r=PG.RECIPES.find(function(x){return x.id===S.dish});
      S.servings=r?r.servings:2;
      S.done={};
      render();
    };
  });
}

render();

/* the fixed back button needs something behind it once the photo scrolls away */
var fade=document.querySelector('.fade');
addEventListener('scroll',function(){
  fade.className='fade'+(S.dish&&scrollY>140?' on':'');
},{passive:true});
})();
</script>
</body>
</html>
