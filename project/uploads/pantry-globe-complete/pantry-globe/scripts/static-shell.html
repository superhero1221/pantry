 *
 * Every previous attempt at real food imagery went looking for a stock
 * photograph of a generic tomato and came back with a Victorian engraving. The
 * premise was wrong: the realest image of the food someone is about to buy is
 * the photograph of the exact product in their hand, and Open Food Facts has
 * millions of them, taken by the people who bought them.
 *
 * The camera path uses the browser's own barcode detector where it exists —
 * modern phone browsers have it — and falls back to typing the numbers, which
 * works everywhere and is the only thing that works when the light is bad.
 */
let scanStream=null, scanTimer=null;
function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}

function scanScreen(){
  const v=el('div','stack fade');
  const back=el('button','btn ghost','← Back');
  back.onclick=()=>{stopScan();S.screen='tonight';render()};
  v.appendChild(back);
  v.appendChild(el('h2',null,'Scan what you are holding'));
  v.appendChild(el('p','muted','You get that product\u2019s own photograph, the nutrition off its label, and what other people have paid for it. Nothing modelled.'))
    .style.cssText='font-size:14px';

  const hasDet = typeof window.BarcodeDetector === 'function';
  const cam=el('div','cam');
  const vid=document.createElement('video'); vid.setAttribute('playsinline',''); vid.muted=true;
  cam.appendChild(vid); cam.appendChild(el('div','box'));

  if(hasDet){
    v.appendChild(cam);
    (async()=>{
      try{
        scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        vid.srcObject=scanStream; await vid.play();
        const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
        scanTimer=setInterval(async()=>{
          try{
            const hits=await det.detect(vid);
            if(hits&&hits.length){ stopScan(); doLookup(hits[0].rawValue); }
          }catch(e){}
        },400);
      }catch(e){
        cam.remove();
        v.insertBefore(el('p','note warn','No camera available here, so type the numbers under the barcode instead.'),v.children[3]);
      }
    })();
  } else {
    v.appendChild(el('p','note tip','This browser cannot read a barcode from the camera. Type the numbers printed under it — it works just as well and never fails in bad light.'));
  }

  const row=el('div'); row.style.cssText='display:flex;gap:9px;align-items:center';
  const inp=el('input'); inp.placeholder='or type the barcode'; inp.inputMode='numeric';
  inp.onkeydown=e=>{if(e.key==='Enter')doLookup(inp.value)};
  const go=el('button','btn sm','Look up'); go.onclick=()=>doLookup(inp.value);
  row.appendChild(inp); row.appendChild(go);
  v.appendChild(row);

  async function doLookup(code){
    S.scanBusy=true;S.scanMsg=null;render();
    try{
      const p=await PG.lookup(String(code||'').trim());
      if(!p){ S.scanMsg='Open Food Facts has never seen that barcode. You could be the first to add it.'; S.scan=null; }
      else {
        p.prices=await PG.pricesFor(p.code,country().currency).catch(()=>[]);
        S.scan=p;
        if(!S.scanned.some(x=>x.code===p.code)) S.scanned.unshift(p);
      }
    }catch(e){ S.scanMsg=e.message||String(e); }
    S.scanBusy=false; render();
  }

  if(S.scanBusy) v.appendChild(el('p','note tip','Looking it up…'));
  if(S.scanMsg) v.appendChild(el('p','note warn',esc(S.scanMsg)));

  if(S.scan){
    const p=S.scan;
    const c=el('div','card');
    const head=el('div','prod');
    if(p.image){ const im=document.createElement('img'); im.src=p.image; im.alt=esc(p.name); head.appendChild(im); }
    head.appendChild(el('div',null,'<h3>'+esc(p.name)+'</h3>'+
      (p.brand?'<p class="muted" style="font-size:13px;margin-top:2px">'+esc(p.brand)+'</p>':'')+
      (p.quantity?'<p class="muted" style="font-size:13px">'+esc(p.quantity)+'</p>':'')));
    c.appendChild(head);

    const n=p.per100;
    if(n.kcal!=null){
      const st=el('div'); st.style.cssText='display:flex;gap:8px;margin-top:14px';
      [['kcal',n.kcal,''],['protein',n.protein,'g'],['carbs',n.carb,'g'],['fat',n.fat,'g'],['salt',n.salt,'g']].forEach(([l,val,u])=>
        st.appendChild(el('div',null,'<span class="lbl">'+l+'</span><p class="num" style="font-weight:720;margin-top:2px">'+
          (val==null?'—':(u==='g'&&val<10?val.toFixed(1):Math.round(val))+u)+'</p>'))
          .style.cssText='flex:1;text-align:center;background:var(--surface2);border-radius:11px;padding:9px 3px');
      c.appendChild(st);
      c.appendChild(el('p','muted','Per 100 g, straight off the label — not modelled by us.')).style.cssText='font-size:11.5px;margin-top:8px';
    } else c.appendChild(el('p','note warn','Nobody has added the nutrition panel for this one yet.')).style.marginTop='12px';

    if(p.prices&&p.prices.length){
      const pr=el('div'); pr.style.cssText='border-top:1px solid var(--line);margin-top:13px;padding-top:12px';
      pr.innerHTML='<span class="lbl">What people have paid</span>';
      p.prices.slice(0,4).forEach(x=>pr.appendChild(el('p','muted',
        money(x.price)+' · '+esc(x.date)+(x.where?' · '+esc(x.where):''))).style.cssText='font-size:12.5px;margin-top:5px');
      c.appendChild(pr);
    } else {
      c.appendChild(el('p','muted','No price recorded for this barcode yet. If you can see one, the shopping list has a button to add it.'))
        .style.cssText='font-size:12px;margin-top:12px';
    }

    const add=el('button','btn primary','Add to what I have');
    add.style.marginTop='14px';
    add.onclick=()=>{
      const ref=PG.guessIngredient(p,PG.OFF_CATEGORY);
      if(ref){ S.pantry.add(ref); save(); S.scanMsg='Added — '+esc(p.name)+' counts as '+ref.replace(/_/g,' ')+', so tonight will not charge you for it.'; }
      else S.scanMsg='Kept it on the list, but it does not match one of the ingredients used in these recipes, so it will not change any prices.';
      render();
    };
    c.appendChild(add);
    v.appendChild(c);
  }

  if(S.scanned.length>1){
    const h=el('div','card');
    h.innerHTML='<span class="lbl">Scanned today</span>';
    const g=el('div'); g.style.cssText='display:flex;gap:9px;overflow-x:auto;margin-top:10px;padding-bottom:4px';
    S.scanned.slice(0,12).forEach(x=>{
      const b=el('button',null); b.style.cssText='flex:0 0 78px;text-align:center;cursor:pointer;background:none;border:0';
      b.innerHTML=(x.image?'<img src="'+esc(x.image)+'" alt="" style="width:70px;height:70px;object-fit:contain;background:#fff;border-radius:11px;border:1px solid var(--line)">':'')+
        '<span style="display:block;font-size:11px;margin-top:5px;line-height:1.2">'+esc((x.name||'').slice(0,26))+'</span>';
      b.onclick=()=>{S.scan=x;S.scanMsg=null;render()};
      g.appendChild(b);
    });
    h.appendChild(g); v.appendChild(h);
  }
  return v;
}

/* ----------------------------------------------------------- find ------ */
/**
 * Search by dish.
 *
 * Matches the name, the name in its own language, the cuisine and the
 * ingredients, because people arrive with all four — "butter chicken", "murgh
 * makhani", "thai", and "I have a tin of chickpeas" are the same question asked
 * differently. Ingredient matches rank below name matches so typing "chicken"
 * does not bury the chicken dishes under everything containing a stock cube.
 */
function findScreen(){
  const v=el('div','stack fade');
  const back=el('button','btn ghost','← Back');
  back.onclick=()=>{S.screen=S.profile.skill?'result':'welcome';render()};
  v.appendChild(back);
  v.appendChild(el('h2',null,'What do you want to cook?'));

  const box=el('input');
  box.placeholder='butter chicken, biryani, something with lentils…';
  box.value=S.query; box.autocapitalize='none'; box.autocorrect='off';
  box.oninput=()=>{S.query=box.value;paint()};
  v.appendChild(box);

  const out=el('div','stack-sm');
  v.appendChild(out);

  function score(r,q){
    const n=r.name.toLowerCase(), ln=(r.localName||'').toLowerCase(), c=r.cuisine.toLowerCase();
    if(n===q) return 100;
    if(n.startsWith(q)) return 90;
    if(n.includes(q)) return 80;
    if(ln.includes(q)) return 75;
    if(c.includes(q)) return 60;
    // ingredient match ranks last so a common ingredient cannot outrank a title
    const hit=r.items.some(i=>{const L=PG.plateLayers([{ref:i.ref,grams:100}])[0];
      return L&&L.name.toLowerCase().includes(q)});
    return hit?40:0;
  }

  function paint(){
    out.innerHTML='';
    const q=S.query.trim().toLowerCase();
    const list=q
      ? PG.RECIPES.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,12).map(x=>x.r)
      : PG.RECIPES.slice(0,8);
    if(!q) out.appendChild(el('p','muted','Or just browse — everything here is written out in full, including what goes wrong.')).style.cssText='font-size:12.5px';
    if(q&&!list.length){
      out.appendChild(el('p','note warn','Nothing here matches "'+esc(S.query)+'". There are '+PG.RECIPES.length+' dishes so far — the collection is small and honest about it rather than padded out.'));
      return;
    }
    const grid=el('div','grid scene'); grid.style.cssText='grid-template-columns:1fr 1fr;gap:14px';
    list.forEach(r=>{
      const b=el('button','bub');
      const orb=el('div','orb');
      const ph=PG.dishPhoto(r.id);
      if(ph){ const im=photoImg(ph,PG.DISH_REMOTE[r.id],'');
        im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover'; orb.appendChild(im); }
      else { const api=plate(r.items,{spread:.86,flat:true});
        api.node.style.cssText='position:absolute;inset:1%;width:98%'; orb.appendChild(api.node); attachTilt(b,api); }
      b.appendChild(orb);
      b.appendChild(el('div','cap','<b>'+esc(r.name)+'</b><s>'+esc(r.cuisine)+' · '+
        (r.totalMin>=120?Math.round(r.totalMin/60)+' h':r.totalMin+' min')+'</s>'));
      b.onclick=()=>{S.dishId=r.id;S.variantId=null;S.dishTab='shop';S.off=new Set();
        S.cameFrom='find';S.screen='dish';render()};
      grid.appendChild(b);
    });
    out.appendChild(grid);
  }
  paint();
  requestAnimationFrame(()=>{try{box.focus()}catch(e){}});
  return v;
}

/**
 * The dish, taken apart in three dimensions.
 *
 * A photograph of a finished plate cannot come apart — but a photograph of the
 * plate with photographs of its ingredients floating above it can, and that is
 * the effect people know from a burger advert. The base is the real dish; each
 * layer above it is a real photograph of one real ingredient, cut out.
 *
 * Only ingredients that HAVE a photograph are floated. Drawing a substitute for
 * the ones that do not would put an illustration in the middle of a stack of
 * photographs, which is the mistake made earlier with the plate and is worse
 * than showing fewer layers.
 *
 * Drag rotates it. Ingredients without a picture are still listed underneath —
 * they are in the dish, they just have nothing to show.
 */
function exploded(r,items){
  const withPix=items.filter(i=>i.ref!=='water'&&PG.ingPhoto(i.ref)).slice(0,8);
  if(!withPix.length) return null;

  const host=el('div','x3d'+(S.exploded?' open':''));
  const stack=el('div','stack');
  host.appendChild(stack);

  const dish=PG.dishPhoto(r.id);
  if(dish){
    const b=el('div','lay base');
    b.style.cssText='width:74%;height:74%;margin:-37% 0 0 -37%';
    b.appendChild(photoImg(dish,PG.DISH_REMOTE[r.id],r.name));
    stack.appendChild(b);
  }

  // heaviest at the bottom, garnish on top — the order things actually go on
  const sorted=[...withPix].sort((a,b)=>b.grams-a.grams);
  sorted.forEach((it,i)=>{
    const L=PG.plateLayers([{ref:it.ref,grams:100}])[0];
    const lay=el('div','lay');
    const size=Math.max(20,Math.min(42,20+Math.log10(Math.max(it.grams,1))*13));
    const ang=(i/sorted.length)*Math.PI*2+0.7;
    const rad=S.exploded?20:6;
    const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad*0.55;
    const z=S.exploded?(i+1)*46:(i+1)*5;
    lay.style.cssText='width:'+size+'%;height:'+size+'%;margin:'+(-size/2)+'% 0 0 '+(-size/2)+'%;'+
      'transform:translate3d('+x.toFixed(1)+'%,'+y.toFixed(1)+'%,'+z+'px)';
    lay.appendChild(photoImg(PG.ingPhoto(it.ref),PG.ING_REMOTE[it.ref],L?L.name:it.ref));
    const g=it.grams*(S.servings/Math.max(r.servings,1));
    const tag=el('div','tag','<b>'+esc((L?L.name:it.ref).split(',')[0])+'</b><s>'+
      (g<1?'a pinch':Math.round(g)+' g')+'</s>');
    // alternate sides so nine labels do not stack on one edge and run off it
    if(i%2) tag.style.cssText='right:104%;left:auto'; else tag.style.cssText='left:104%;right:auto';
    lay.appendChild(tag);
    lay.onclick=e=>{e.stopPropagation();S.ingPick=it.ref;render();
      const grid=document.querySelector('.ings'); if(grid)grid.scrollIntoView({block:'center',behavior:'smooth'})};
    stack.appendChild(lay);
  });

  // drag to turn it over
  let rx=S.exploded?58:16, rz=S.exploded?-14:0, down=null;
  const paint=()=>{stack.style.transform='rotateX('+rx.toFixed(1)+'deg) rotateZ('+rz.toFixed(1)+'deg)'};
  paint();
  host.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,rx:rx,rz:rz};host.setPointerCapture(e.pointerId)});
  host.addEventListener('pointermove',e=>{
    if(!down) return;
    rx=Math.max(0,Math.min(80,down.rx+(e.clientY-down.y)*0.28));
    rz=down.rz+(e.clientX-down.x)*0.3;
    stack.style.transition='none'; paint();
  });
  const up=()=>{down=null;stack.style.transition=''};
  host.addEventListener('pointerup',up); host.addEventListener('pointercancel',up);

  host.appendChild(el('div','hint',S.exploded?'drag to turn it · tap a piece':'drag to turn it'));
  return host;
}

function macrosOnly(items,r){
  const cur=PG.nutrition(items,r.servings);
  const m=el('div','glass'); m.style.cssText='padding:13px 15px;margin-top:10px';
  m.innerHTML='<div style="display:flex;gap:4px;justify-content:space-between">'+
    [['kcal',cur.kcal,''],['Protein',cur.protein,'g'],['Carbs',cur.carb,'g'],['Fat',cur.fat,'g'],['Fibre',cur.fibre,'g']]
    .map(([l,v,u])=>'<div style="text-align:center;flex:1"><span class="lbl">'+l+'</span>'+
      '<p class="num" style="margin-top:3px;font-size:16px;font-weight:700;letter-spacing:-.02em">'+Math.round(v)+u+'</p></div>').join('')+'</div>';
  return m;
}

/* ------------------------------------------------------- dish stage ---- */
/**
 * The dish, drawn and taken apart.
 *
 * Lifting an ingredient off has to change real numbers or the whole gesture is
 * decoration. So removals feed straight back into the same nutrition function
 * the planner uses — pull the pasta and the carb figure that drops is the one
 * the rest of the app would have reported.
 */
function dishStage(r,items,fullN){
  const wrap=el('div','stack-sm');

  // A real photograph of the real dish, from its own Wikipedia article. The
  // illustration underneath is not a failed attempt at this — it is the part
  // you can pull apart, which a photograph can never be.
  const photo=PG.dishPhoto(r.id);
  if(photo && S.view==='photo'){
    const h=el('div','hero');
    h.appendChild(photoImg(photo,PG.DISH_REMOTE[r.id],r.name));
    const c=PG.DISH_CREDITS.find(x=>x.id===r.id);
    if(c) h.appendChild(el('div','cr','Photo: '+esc(c.author)+' · '+esc(c.licence)+
      (c.page?' · <a href="'+esc(c.page)+'" target="_blank" rel="noopener">source</a>':'')));
    wrap.appendChild(h);
  }
  if(photo){
    const sw=el('div','heroswap');
    [['Photo','photo'],['Take apart','3d'],['Diagram','plate']].forEach(([l,v])=>{
      const b=el('button','btn sm'+(S.view===v?' primary':'')); b.style.cssText='flex:1;padding:11px 4px';
      b.textContent=l;
      b.onclick=()=>{S.view=v;S.exploded=(v==='3d');render()}; sw.appendChild(b);
    });
    wrap.appendChild(sw);
  }
  if(photo && S.view!=='plate'){
    if(S.view==='3d'){
      const x=exploded(r,items);
      if(x){ wrap.insertBefore(x,wrap.firstChild); if(wrap.querySelector('.hero')) wrap.querySelector('.hero').remove(); }
    }
    wrap.appendChild(macrosOnly(items,r));
    return wrap;
  }
  const stage=el('div','scene'); stage.style.cssText='position:relative;margin:2px 0 4px';

  const live=()=>items.filter(i=>!S.off.has(i.ref));
  let api=null, focus=null;

  const macros=el('div','glass'); macros.style.cssText='padding:13px 15px;position:relative;z-index:4';
  const ghosts=el('div'); ghosts.style.cssText='display:flex;flex-wrap:wrap;gap:6px';

  function paintMacros(){
    const cur=PG.nutrition(live(),r.servings);
    const d=(a,b)=>{const x=Math.round(a)-Math.round(b);return x===0?'':'<i style="font-style:normal;font-size:11px;color:'+(x<0?'var(--warn)':'var(--accent)')+';margin-left:4px">'+(x>0?'+':'')+x+'</i>';};
    macros.innerHTML='<div style="display:flex;gap:4px;justify-content:space-between">'+
      [['kcal',cur.kcal,fullN.kcal,''],['Protein',cur.protein,fullN.protein,'g'],
       ['Carbs',cur.carb,fullN.carb,'g'],['Fat',cur.fat,fullN.fat,'g'],['Fibre',cur.fibre,fullN.fibre,'g']]
      .map(([l,c,f,u])=>'<div style="text-align:center;flex:1"><span class="lbl">'+l+'</span>'+
        '<p class="num" style="margin-top:3px;font-size:16px;font-weight:700;letter-spacing:-.02em">'+Math.round(c)+u+d(c,f)+'</p></div>').join('')+
      '</div>';
    ghosts.innerHTML='';
    if(S.off.size){
      [...S.off].forEach(ref=>{
        const chip=el('button','chip','↩ '+esc(nameOf(ref)));
        chip.title='Put it back';
        chip.onclick=()=>{S.off.delete(ref);rebuild()};
        ghosts.appendChild(chip);
      });
      const all=el('button','chip','Put everything back');
      all.onclick=()=>{S.off.clear();rebuild()};
      ghosts.appendChild(all);
    }
  }

  function callout(ref){
    stage.querySelectorAll('.call').forEach(x=>x.remove());
    if(!ref) return;
    const L=api.layers.find(x=>x.ref===ref); if(!L) return;
    const c=PG.contribution(live(),ref,r.servings); if(!c) return;
    const unit=c.headline==='kcal'?'':'g';
    const val=Math.round(c[c.headline]);
    const box=el('div','call');
    // Sit the label on the emptier side and above the piece, so the thing being
    // measured is never hidden by the number describing it.
    const lx=(L.anchor.x-2)/96*100, ly=(L.anchor.y-14)/78*100;
    if(lx<50){ box.style.left=Math.min(56,lx+13)+'%'; box.style.right='auto'; }
    else { box.style.right=Math.min(56,(100-lx)+13)+'%'; box.style.left='auto'; }
    box.style.top=Math.max(0,ly-24)+'%';
    box.innerHTML='<div class="bx"><u>'+esc(c.name.split(',')[0])+'</u>'+
      '<b>'+val+unit+' '+esc(c.headline==='kcal'?'kcal':c.headline)+'</b>'+
      '<i>'+Math.round(c.share*100)+'% of the dish</i></div>';
    stage.appendChild(box);
  }

  function pick(ref){
    focus=(focus===ref?null:ref);
    api.setFocus(focus);
    callout(focus);
    detail(focus);
  }

  const det=el('div');
  function detail(ref){
    det.innerHTML='';
    if(!ref){ det.appendChild(el('p','muted','Tap anything on the plate to see what it is doing. Tap it again to put it down.')).style.cssText='font-size:12.5px;text-align:center'; return; }
    const c=PG.contribution(live(),ref,r.servings); if(!c) return;
    const card=el('div','card2');
    card.innerHTML='<div class="row"><h3>'+esc(c.name)+'</h3><span class="num muted" style="font-size:12px">'+Math.round(c.grams)+' g a serving</span></div>'+
      '<div style="display:flex;gap:10px;margin-top:11px">'+
      [['kcal',c.kcal,''],['P',c.protein,'g'],['C',c.carb,'g'],['F',c.fat,'g']]
        .map(([l,val,u])=>'<div style="flex:1;text-align:center;background:var(--surface);border-radius:11px;padding:8px 4px">'+
          '<span class="lbl">'+l+'</span><p class="num" style="font-weight:680;margin-top:2px">'+Math.round(val)+u+'</p></div>').join('')+
      '</div>'+
      (c.note?'<p class="note tip" style="margin-top:11px">'+esc(c.note)+'</p>':'');
    const off=el('button','btn sm',S.off.has(ref)?'Put it back':'Take it off and see');
    off.style.cssText='width:100%;margin-top:11px';
    off.onclick=()=>{ S.off.has(ref)?S.off.delete(ref):S.off.add(ref); focus=null; rebuild(); };
    card.appendChild(off);
    det.appendChild(card);
  }

  /**
   * The chip rail.
   *
   * Tapping the plate directly only ever reaches whatever is drawn on top —
   * the rice under the chicken is unhittable, which is precisely the ingredient
   * someone wants to interrogate. So every ingredient also gets a chip, always
   * reachable regardless of stacking, and that is what makes the view usable
   * with a keyboard or a screen reader as well.
   */
  const rail=el('div','scroll rail'); rail.style.marginTop='2px';
  function paintRail(){
    rail.innerHTML='';
    api.layers.forEach(L=>{
      const b=el('button','chip'+(focus===L.ref?' on':''));
      const pic=PG.PHOTOS[L.ref];
      b.innerHTML=(pic
        ? '<img src="'+pic+'" alt="" style="width:20px;height:20px;object-fit:contain;margin-right:7px">'
        : '<span style="width:9px;height:9px;border-radius:3px;flex:0 0 9px;margin-right:7px;'+
          'background:'+esc(L.color)+';box-shadow:0 0 0 1px rgba(0,0,0,.35) inset"></span>')+esc(L.name.split(',')[0]);
      b.onclick=()=>pick(L.ref);
      rail.appendChild(b);
      if(focus===L.ref) requestAnimationFrame(()=>{try{b.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}});
    });
  }

  let mode=0; // 0 plated, 1 taken apart
  const seg=el('div','seg'); seg.style.marginTop='2px';
  [['Plated',0],['Take it apart',1]].forEach(([l,m])=>{
    const b=el('button',mode===m?'on':''); b.textContent=l;
    b.onclick=()=>{mode=m;[...seg.children].forEach((c,i)=>c.className=i===m?'on':'');
      api.setExplode(mode);};
    seg.appendChild(b);
  });

  function rebuild(){
    stage.innerHTML='';
    api=plate(live(),{onPick:pick});
    stage.appendChild(api.node);
    if(!focus){ stage.appendChild(el('div','tapme','tap anything on the plate')); }
    attachTilt(stage,api);
    api.setFocus(focus); api.setExplode(mode);
    callout(focus); detail(focus); paintMacros(); paintRail();
  }

  const _pick=pick;
  pick=function(ref){ _pick(ref); paintRail(); };

  rebuild();
  wrap.appendChild(stage);
  wrap.appendChild(macros);
  const more=el('button','btn ghost',S.dishOpen?'Hide ingredients':'Take it apart · '+api.layers.length+' ingredients');
  more.style.cssText='font-size:12.5px;justify-content:center;width:100%;margin-top:2px';
  more.onclick=()=>{S.dishOpen=!S.dishOpen;render()};
  wrap.appendChild(more);
  if(S.dishOpen){ wrap.appendChild(seg); wrap.appendChild(rail); wrap.appendChild(det); wrap.appendChild(ghosts); }
  return wrap;
}
const nameOf=ref=>((PG.plateLayers([{ref:ref,grams:100}])[0]||{}).name||ref).split(',')[0];

/**
 * The ingredients, laid out.
 *
 * Asked for the HelloFresh pattern: scroll down and every ingredient is there
 * to look at, with the option to change one. Until now they were behind a
 * "take it apart" toggle and then a scrolling rail of chips, which is a list of
 * words, not a look at what you are cooking.
 *
 * Swapping is per ingredient rather than per variant. The data is shaped as
 * variants with names like "Leaner, more beans", but nobody wants a variant —
 * they want the chicken to be salmon. So the question is asked on the thing
 * being replaced, and whatever else that variant changes is stated rather than
 * happening quietly.
 */
function ingredientGrid(r, items, servings){
  const box=el('div','card');
  box.appendChild(el('div','row','<h3>What goes in</h3><span class="muted" style="font-size:12.5px">'+
    items.length+' things · for '+servings+'</span>'));
  const scale=servings/Math.max(r.servings,1);
  const grid=el('div','ings');

  items.forEach(it=>{
    const L=PG.plateLayers([{ref:it.ref,grams:100}])[0];
    if(!L) return;
    const g=(it.grams*scale);
    const opts=PG.swapsFor(r,it.ref);
    const card=el('button','ing'+(S.ingPick===it.ref?' on':''));
    const pic=el('div','pic');
    const pic2=PG.ingPhoto(it.ref)||PG.PHOTOS[it.ref];
    if(pic2){ pic.appendChild(photoImg(pic2,PG.ING_REMOTE[it.ref],'')); }
    else { const api=plate([{ref:it.ref,grams:100}],{bare:true,flat:true,spread:.5}); pic.appendChild(api.node); }
    card.appendChild(pic);
    card.appendChild(el('div','nm',esc(L.name.split(',')[0])));
    card.appendChild(el('div','qt',(g<1?'a pinch':g<10?g.toFixed(1)+' g':Math.round(g)+' g')));
    if(opts.length) card.appendChild(el('div','sw','SWAP'));
    card.onclick=()=>{S.ingPick=(S.ingPick===it.ref?null:it.ref);render()};
    grid.appendChild(card);
  });
  box.appendChild(grid);

  if(S.ingPick){
    const it=items.find(x=>x.ref===S.ingPick);
    if(it){
      const c=PG.contribution(items,it.ref,r.servings);
      const opts=PG.swapsFor(r,it.ref);
      const d=el('div','card2'); d.style.marginTop='13px';
      d.innerHTML='<div class="row"><h3>'+esc(c?c.name:it.ref)+'</h3>'+
        '<span class="muted num" style="font-size:12.5px">'+Math.round((it.grams*scale))+' g</span></div>';
      if(c){
        const st=el('div'); st.style.cssText='display:flex;gap:8px;margin-top:11px';
        [['kcal',c.kcal,''],['protein',c.protein,'g'],['carbs',c.carb,'g'],['fat',c.fat,'g']].forEach(([l,v,u])=>
          st.appendChild(el('div',null,'<span class="lbl">'+l+'</span><p class="num" style="font-weight:720;margin-top:2px">'+Math.round(v)+u+'</p>'))
            .style.cssText='flex:1;text-align:center;background:var(--surface);border-radius:11px;padding:9px 4px');
        d.appendChild(st);
        if(c.note) d.appendChild(el('p','note tip',esc(c.note))).style.marginTop='11px';
      }
      if(!opts.length) d.appendChild(el('p','muted','No swap written for this one yet.')).style.cssText='font-size:12.5px;margin-top:11px';
      else {
        d.appendChild(el('span','lbl','Swap it for')).style.cssText='display:block;margin-top:14px';
        opts.forEach(o=>{
          const b=el('button','btn sm'); b.style.cssText='width:100%;margin-top:8px;justify-content:space-between;text-align:left';
          b.innerHTML='<span><span style="display:block;font-weight:720">'+esc(o.toName.split(",")[0])+
            (o.grams?' · '+Math.round(o.grams*scale)+' g':'')+'</span>'+
            (o.alsoChanges.length?'<span class="muted" style="font-size:11.5px;font-weight:500">also '+esc(o.alsoChanges.slice(0,2).join(', '))+'</span>':'')+
            '</span><span style="color:var(--accent)">›</span>';
          b.onclick=e=>{e.stopPropagation();S.variantId=o.variantId;S.ingPick=null;S.off=new Set();render()};
          d.appendChild(b);
        });
        if(S.variantId){
          const back=el('button','btn ghost','↩ Back to the original');
          back.style.cssText='width:100%;margin-top:9px;justify-content:center;font-size:12.5px';
          back.onclick=e=>{e.stopPropagation();S.variantId=null;S.ingPick=null;S.off=new Set();render()};
          d.appendChild(back);
        }
      }
      box.appendChild(d);
    }
  }
  return box;
}

/* ------------------------------------------------------------- dish ---- */
function dish(){
  const r=byId(S.dishId); if(!r){S.screen='result';return result()}
  const v=el('div','stack fade');
  const back=el('button','btn ghost',S.cameFrom==='find'?'← Back to search':S.cameFrom==='tonight'?'← Back to tonight':'← Back to the week');
  back.onclick=()=>{S.screen=(S.cameFrom==='find'||S.cameFrom==='tonight')?S.cameFrom:'result';render()}; v.appendChild(back);

  const head=el('div','card stack-sm');
  head.appendChild(el('h2',null,esc(r.name)));
  if(r.localName) head.appendChild(el('p',null,'<span style="color:var(--accent);font-size:13.5px">'+esc(r.localName)+'</span>'));
  head.appendChild(el('p','muted',esc(r.blurb))).style.cssText='font-size:13.5px;margin-top:6px';
  head.appendChild(stepper('Servings','servings',1,12,S));
  if(r.variants.length){
    head.appendChild(el('span','lbl','Version'));
    const sc=el('div','scroll');
    const o=el('button','chip'+(S.variantId?'':' on'),'Original'); o.onclick=()=>{S.variantId=null;S.off=new Set();render()}; sc.appendChild(o);
    r.variants.forEach(vr=>{const b=el('button','chip'+(S.variantId===vr.id?' on':''),esc(vr.label));b.onclick=()=>{S.variantId=vr.id;S.off=new Set();render()};sc.appendChild(b)});
    head.appendChild(sc);
    // scroll the active version into view — otherwise the banner names a variant
    // whose chip is off-screen, which reads like a bug
    requestAnimationFrame(()=>{const on=sc.querySelector('.chip.on'); if(on&&on.offsetLeft>40) sc.scrollLeft=on.offsetLeft-16;});
  }
  v.appendChild(head);

  const tabs=el('div','grid'); tabs.style.gridTemplateColumns='repeat(4,1fr)'; tabs.style.gap='7px';
  [['shop','Cost'],['where','Where'],['nutrition','Nutrition'],['cook','Method']].forEach(([k,l])=>{
    const b=el('button','btn sm'+(S.dishTab===k?' primary':'')); b.style.width='100%'; b.textContent=l;
    b.style.cssText='width:100%;padding:10px 4px;font-size:13px';
    b.onclick=()=>{S.dishTab=k;render()}; tabs.appendChild(b);
  });
  v.appendChild(tabs);

  const items=PG.applyVariant(r,S.variantId);
  const n=PG.nutrition(items,r.servings);
  const b=PG.priceBasket(items,country(),S.tier,S.servings,r.servings,S.pantry);
  const rest=PG.restaurantPrice(r,country())*S.servings;
  v.insertBefore(dishStage(r,items,n),v.children[2]);
  v.insertBefore(ingredientGrid(r,items,S.servings),v.children[3]);

  if(S.dishTab==='shop'){
    // The comparison people actually came for, stated first and at full size.
    const homePer=b.marginal/Math.max(S.servings,1);
    const outPer=PG.restaurantPrice(r,country());
    const saveEach=outPer-homePer;
    const vs=el('div','card');
    vs.innerHTML='<span class="lbl">Cooking it vs ordering it</span>';
    const two=el('div','row'); two.style.marginTop='6px';
    two.innerHTML='<div><p class="muted" style="font-size:13px">At home, per serving</p>'+
      '<p class="big" style="color:var(--accent)">'+money(homePer)+'</p></div>'+
      '<div style="text-align:right"><p class="muted" style="font-size:13px">Ordered in</p>'+
      '<p class="big">'+money(outPer)+'</p></div>';
    vs.appendChild(two);
    if(saveEach>0){
      vs.appendChild(el('p','note good','You keep '+money(saveEach)+' a serving. Cooking for '+S.servings+
        ' saves '+money(saveEach*S.servings)+' tonight, and '+money(saveEach*S.servings*4)+' if you do it once a week for a month.'));
      const bar=el('div'); bar.style.cssText='margin-top:12px';
      const pct=Math.max(4,Math.min(100,homePer/Math.max(outPer,0.01)*100));
      bar.innerHTML='<div style="height:12px;border-radius:999px;background:var(--surface2);overflow:hidden">'+
        '<i style="display:block;height:100%;width:'+pct.toFixed(0)+'%;background:var(--accent);border-radius:999px"></i></div>'+
        '<p class="muted" style="font-size:11.5px;margin-top:7px">Cooking it costs '+Math.round(pct)+
        '% of what ordering it does.</p>';
      vs.appendChild(bar);
    } else {
      vs.appendChild(el('p','note warn','Ordering this in is actually cheaper per serving once you count the whole shop. '+
        'That flips the moment you cook it twice — the second time costs '+money(homePer)+' because the cupboard is already stocked.'));
    }
    vs.appendChild(el('p','muted','Ordered-in price is a typical UK takeaway portion for this dish, scaled to '+
      esc(country().name)+'. Your local will differ.')).style.cssText='font-size:11.5px;margin-top:10px';
    v.appendChild(vs);

    // Feeding other people is a different question: it scales, and the saving
    // scales with it, which is the whole argument for cooking rather than
    // ordering for a group.
    if(saveEach>0){
      const grp=el('div','card');
      grp.innerHTML='<span class="lbl">Cooking it for people</span>';
      const t=el('div'); t.style.cssText='margin-top:9px;font-size:14px';
      [2,4,6,8].forEach(n=>{
        const home=homePer*n, out=outPer*n;
        t.innerHTML+=row(n+' people', money(home)+' vs '+money(out)+' · keep '+money(out-home), n===S.servings?'accent':'muted');
      });
      grp.appendChild(t);
      grp.appendChild(el('p','muted','At-home figures assume the cupboard staples are already there, which they are after the first cook.'))
        .style.cssText='font-size:11.5px;margin-top:9px';
      v.appendChild(grp);
    }

    const c=el('div','card');
    c.appendChild(el('div','row','<div><span class="lbl">Every pack</span><p class="big">'+money(b.firstCook)+'</p></div>'+
      '<div style="text-align:right"><span class="lbl">Once stocked</span><p class="big" style="color:var(--accent)">'+money(b.marginal)+'</p></div>'));
    const saved=rest-b.firstCook, rep=rest-b.marginal;
    const per=b.marginal/Math.max(S.servings,1);
    const bl=PG.benchmark(per,country());
    const kit=bl.find(x=>x.id==='kit_full')||bl[0];
    const sm=el('div'); sm.style.cssText='border-top:1px solid var(--line);margin-top:15px;padding-top:13px;font-size:13.5px';
    sm.innerHTML=row('Per serving, once stocked',money(per),'accent')+
      row('Same dish as a meal kit',money(kit.low)+'–'+money(kit.high),'muted')+
      row('Ordering in ('+S.servings+')',money(rest),'muted')+
      (saved>0?row('You save tonight vs ordering in',money(saved),'strong'):row('Costs more than ordering in','+'+money(-saved),'strong'))+
      row('Saved on every repeat',money(Math.max(0,rep)),'accent');
    c.appendChild(sm);
    const hd=PG.headline(bl,per,money);
    c.appendChild(el('p','note '+hd.kind,esc(hd.text))).style.marginTop='13px';
    if(saved<=0&&rep>0) c.appendChild(el('p','note good','Tonight this costs more than a takeaway — you are buying a spice rack, not a meal. It pays back on cook two, then saves about '+money(rep)+' every time. Roughly '+Math.ceil(b.firstCook/Math.max(rep,1))+' cooks to break even.')).style.marginTop='11px';
    v.appendChild(c);
    const bk=el('div','card stack-sm');
    bk.appendChild(el('h3',null,'Ingredients'));
    const l=el('div'); b.items.forEach(it=>l.appendChild(shopRow(it))); bk.appendChild(l);
    const cb=contributeBar(b.items); if(cb) bk.appendChild(cb);
    bk.appendChild(provenance(b.coverage));
    v.appendChild(bk);
  }

  // Someone who has just landed in a city knows the dish and knows nothing
  // about the shops. That is the whole scenario, and it was only reachable
  // from a weekly plan.
  if(S.dishTab==='where') v.appendChild(whereToBuy({shopping:b.items}));

  if(S.dishTab==='nutrition') v.appendChild(nutrition(n,'Per serving'));

  if(S.dishTab==='cook'){
    const vr=S.variantId?r.variants.find(x=>x.id===S.variantId):null;
    const deltas={}; const gen={};
    PG.methodNotes(r,S.variantId).forEach(d=>{
      (deltas[d.step]=deltas[d.step]||[]).push(d.change);
      if(d.generated) gen[d.change]=true;
    });
    const info=el('div','card row');
    info.innerHTML=['Active',r.activeMin+' min','Total',(r.totalMin>=120?(r.totalMin/60).toFixed(1)+' h':r.totalMin+' min'),'Level',r.difficulty]
      .reduce((a,_,i,arr)=>i%2?a+'<div style="text-align:center;flex:1"><span class="lbl">'+esc(arr[i-1])+'</span><p style="margin-top:3px;font-weight:620">'+esc(arr[i])+'</p></div>':a,'');
    v.appendChild(info);
    if(vr) v.appendChild(el('div','card','<p style="font-size:13.5px;font-weight:620;color:var(--accent)">Cooking "'+esc(vr.label)+'" — '+Object.keys(deltas).length+' step'+(Object.keys(deltas).length===1?'':'s')+' change</p><p class="muted" style="margin-top:6px;font-size:12.5px">Changing an ingredient without changing the method is how you end up with dry chicken. The changes are marked below.</p>'));
    const go=el('button','btn primary','▶  Start cooking');
    go.onclick=()=>{S.cookStep=0;S.screen='cook';render()};
    v.appendChild(go);

    const m=el('div','card');
    r.method.forEach(s=>{
      const d=el('div','step');
      let h='<div class="n num">'+s.n+'</div><div style="flex:1;min-width:0"><p style="font-size:14.5px">'+esc(s.text)+'</p>';
      if(s.minutes) h+='<p class="muted" style="margin-top:5px;font-size:12px">≈ '+s.minutes+' min</p>';
      if(s.tip) h+='<p class="note tip" style="margin-top:9px">'+esc(s.tip)+'</p>';
      (deltas[s.n]||[]).forEach(c=>{h+='<p class="note delta" style="margin-top:9px;font-weight:540'+(gen[c]?';opacity:.85':'')+'">'+esc(c)+'</p>'});
      d.innerHTML=h+'</div>'; m.appendChild(d);
    });
    v.appendChild(m);
    const sa=PG.storageAdvice(items);
    if(sa) v.appendChild(el('div','card','<h3>Keeping the leftovers</h3><p class="note warn" style="margin-top:10px">'+esc(sa.text)+'</p>'));
    if(r.failures.length){
      const f=el('div','card stack-sm'); f.appendChild(el('h3',null,'If it goes wrong'));
      r.failures.forEach(x=>f.appendChild(el('div',null,'<p style="font-size:13.5px;font-weight:560">'+esc(x.symptom)+'</p><p class="muted" style="font-size:13px;margin-top:2px">'+esc(x.cause)+'</p>')));
      v.appendChild(f);
    }
  }
  return v;
}

/* ---------------------------------------------------------- account ---- */
function account(){
  const v=el('div','stack fade');
  const back=el('button','btn ghost','← Back');
  back.onclick=()=>{S.screen='result';authMsg=null;render()};
  v.appendChild(back);

  if(!sb){
    v.appendChild(el('h2',null,'Account'));
    v.appendChild(el('p','note warn','Could not reach the accounts service — you are probably offline. Everything still works; your profile and pantry are saved on this device and will sync when you next open it online.'));
    return v;
  }

  if(user){
    v.appendChild(el('h2',null,'Your account'));
    const c=el('div','card stack-sm');
    c.appendChild(el('div','row','<span class="lbl">Signed in as</span><span style="font-size:14px">'+esc(user.email||'—')+'</span>'));
    c.appendChild(el('div','row','<span class="lbl">Synced</span><span style="font-size:14px">profile · pantry ('+S.pantry.size+' items)</span>'));
    v.appendChild(c);

    const sync=el('button','btn primary','Sync now');
    sync.onclick=async()=>{ authBusy=true;render(); await pushRemote(); authBusy=false; render(); };
    v.appendChild(sync);

    const out=el('button','btn','Sign out');
    out.onclick=async()=>{ await sb.auth.signOut(); user=null; authMsg='Signed out. Your data stays on this device.'; render(); };
    v.appendChild(out);

    if(authMsg) v.appendChild(el('p','note good',esc(authMsg)));
    v.appendChild(el('p','muted','Your answers and pantry are stored against your account and nothing else. No location, no shopping history, no tracking. Row-level security means the database physically cannot return another user\'s rows.'))
      .style.cssText='font-size:11.5px;line-height:1.6;margin-top:8px';
    return v;
  }

  v.appendChild(el('h2',null,'Sign in'));
  v.appendChild(el('p','muted','Optional. The app works fully without one — an account just carries your profile, pantry and plans between your phone and laptop.'))
    .style.cssText='font-size:14px;margin-top:8px';

  const c=el('div','card stack-sm'); c.style.marginTop='6px';
  const em=el('input'); em.type='email'; em.placeholder='you@example.com'; em.autocomplete='email';
  const pw=el('input'); pw.type='password'; pw.placeholder='Password (8+ characters)'; pw.autocomplete='current-password';
  c.appendChild(el('span','lbl','Email')); c.appendChild(em);
  c.appendChild(el('span','lbl','Password')); c.appendChild(pw);
  v.appendChild(c);

  const doAuth=async(mode)=>{
    if(!em.value||pw.value.length<8){ authMsg='Enter an email and a password of at least 8 characters.'; render(); return; }
    authBusy=true; authMsg=null; render();
    try{
      const fn = mode==='up' ? sb.auth.signUp.bind(sb.auth) : sb.auth.signInWithPassword.bind(sb.auth);
      const {data,error}=await fn({email:em.value.trim(),password:pw.value});
      if(error) throw error;
      if(mode==='up' && !data.session){ authMsg='Check your email to confirm the address, then sign in.'; }
      else { user=data.user; await pushRemote(); S.screen='result'; authMsg=null; }
    }catch(e){ authMsg=e.message||String(e); }
    authBusy=false; render();
  };

  const inb=el('button','btn primary',authBusy?'…':'Sign in');
  inb.onclick=()=>doAuth('in');
  const upb=el('button','btn',authBusy?'…':'Create an account');
  upb.onclick=()=>doAuth('up');
  v.appendChild(inb); v.appendChild(upb);

  if(authMsg) v.appendChild(el('p','note warn',esc(authMsg)));

  v.appendChild(el('p','muted','We store your six onboarding answers, your pantry list and your saved plans. Nothing else — no location, no shopping history.'))
    .style.cssText='font-size:11.5px;line-height:1.6;margin-top:10px';
  return v;
}

/* -------------------------------------------------------- cook mode ---- */
/* A separate screen rather than a scroll position: cooking is the one time
   someone is holding a phone with wet hands, glancing at it between actions.
   One step, large type, and a thumb-sized Next. */
function cookMode(){
  const r=byId(S.dishId); if(!r){S.screen='result';return result()}
  const vr=S.variantId?r.variants.find(x=>x.id===S.variantId):null;
  const deltas={}; if(vr) vr.methodDeltas.forEach(d=>{(deltas[d.step]=deltas[d.step]||[]).push(d.change)});
  const i=Math.min(S.cookStep,r.method.length-1);
  const st=r.method[i];
  const v=el('div','fade');

  const top=el('div','row');
  const x=el('button','btn ghost','✕ Exit');
  x.onclick=()=>{S.screen='dish';S.dishTab='cook';render()};
  top.appendChild(x);
  top.appendChild(el('span','lbl',esc(r.name)));
  v.appendChild(top);

  const prog=el('div','prog'); prog.style.marginTop='18px';
  r.method.forEach((_,k)=>prog.appendChild(el('i',k<=i?'done':'')));
  v.appendChild(prog);

  const body=el('div','cookstep');
  body.innerHTML='<p class="cooknum">Step '+(i+1)+' of '+r.method.length+(st.minutes?' · about '+st.minutes+' min':'')+'</p>'+
    '<p class="cooktext">'+esc(st.text)+'</p>';
  if(st.tip) body.appendChild(el('p','note tip',esc(st.tip))).style.marginTop='18px';
  (deltas[st.n]||[]).forEach(c=>body.appendChild(el('p','note delta',esc(c))).style.marginTop='12px');
  v.appendChild(body);

  // what you need, so nobody has to leave the screen mid-cook
  if(i===0){
    const items=PG.applyVariant(r,S.variantId).filter(x=>x.ref!=='water');
    const c=el('div','card stack-sm');
    c.appendChild(el('h3',null,'Everything you need'));
    const g=el('div'); g.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
    const scale=S.servings/r.servings;
    items.forEach(x=>{
      const n=PG.NUTRIENTS?PG.NUTRIENTS[x.ref]:null;
      g.appendChild(el('span','pill',esc((n?n.name:x.ref))+' · '+Math.round(x.grams*scale)+' g'));
    });
    c.appendChild(g);
    v.appendChild(c);
  }

  const bar=el('div','bottom');
  if(i>0){
    const b=el('button','btn','Back');
    b.onclick=()=>{S.cookStep=i-1;render()};
    bar.appendChild(b);
  }
  const nx=el('button','btn primary', i===r.method.length-1?'Done ✓':'Next step →');
  nx.onclick=()=>{
    if(i===r.method.length-1){ S.screen='dish'; S.dishTab='cook'; }
    else S.cookStep=i+1;
    render();
  };
  bar.appendChild(nx);
  v.appendChild(bar);
  v.appendChild(el('div')).style.height='70px';
  return v;
}

/* -------------------------------------------------------- nutrition ---- */
function nutrition(n,title){
  const w=el('div','stack');
  const p=el('div','card');
  p.innerHTML='<span class="lbl">'+esc(title)+'</span><p class="big" style="font-size:36px">'+Math.round(n.kcal)+'<span class="muted" style="font-size:15px;font-weight:500;letter-spacing:0"> kcal</span></p>';
  const g=el('div','grid'); g.style.cssText='grid-template-columns:1fr 1fr 1fr;margin-top:16px';
  [['Protein',n.protein,'var(--accent)'],['Carbs',n.carb,'var(--text)'],['Fat',n.fat,'var(--warn)']].forEach(([l,val,c])=>
    g.appendChild(el('div','card2','<span class="lbl">'+l+'</span><p class="num" style="margin-top:3px;font-size:21px;font-weight:700;color:'+c+'">'+Math.round(val)+'<span style="font-size:13px">g</span></p>')));
  p.appendChild(g);
  const pe=n.protein*4/Math.max(n.kcal,1)*100;
  p.appendChild(el('p','muted',esc('Protein is '+Math.round(pe)+'% of calories.'+(pe>=30?' Strong for holding muscle in a deficit.':pe>=20?' Reasonable, not high.':' Low — try a higher-protein version.')))).style.cssText='font-size:12.5px;margin-top:13px';
  w.appendChild(p);

  const m=el('div','card stack-sm'); m.appendChild(el('h3',null,'Micronutrients'));
  [['Fibre',n.fibre,PG.RNI.fibre,'g'],['Iron',n.iron,PG.RNI.iron,'mg'],['Calcium',n.calcium,PG.RNI.calcium,'mg'],
   ['Vitamin B12',n.b12,PG.RNI.b12,'µg'],['Zinc',n.zinc,PG.RNI.zinc,'mg'],['Vitamin A',n.vitA,PG.RNI.vitA,'µg'],
   ['Vitamin C',n.vitC,PG.RNI.vitC,'mg'],['Potassium',n.potassium,PG.RNI.potassium,'mg']].forEach(([l,val,rni,u])=>{
    const pct=val/rni*100, col=pct>=50?'var(--accent)':pct>=20?'var(--warn)':'var(--bad)';
    m.appendChild(el('div',null,'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>'+l+'</span>'+
      '<span class="num muted">'+(val<10?val.toFixed(1):Math.round(val))+' '+u+' · <span style="color:'+col+'">'+Math.round(pct)+'%</span></span></div>'+
      '<div class="bar"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div>'));
  });
  const sp=n.sodium/PG.RNI.sodium*100, sc=sp>75?'var(--bad)':'var(--muted)';
  m.appendChild(el('div',null,'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Sodium</span><span class="num muted">'+Math.round(n.sodium)+' mg · <span style="color:'+sc+'">'+Math.round(sp)+'% of limit</span></span></div><div class="bar"><i style="width:'+Math.min(100,sp)+'%;background:'+sc+'"></i></div>'));
  m.appendChild(el('p','muted','Against UK adult reference intakes. Sodium is shown versus the daily limit, not a target.')).style.cssText='font-size:11.5px;margin-top:12px';
  w.appendChild(m);

  if(n.b12<0.4){
    const b=el('div','card'); b.style.borderColor='rgba(255,122,122,.4)';
    b.innerHTML='<p style="font-size:13px;color:var(--bad)"><strong>B12 warning.</strong> This delivers '+n.b12.toFixed(1)+' µg — effectively none. Plant-only versions carry B12 only from fortified products; if yours is not fortified it is zero, and B12 is the one nutrient a plant-based diet cannot improvise.</p>';
    w.appendChild(b);
  }
  return w;
}

/* ----------------------------------------------------------- render ---- */
/**
 * Cards arrive as they scroll into view.
 *
 * One observer, rebuilt per render, unobserving each element the moment it has
 * played. A card that re-animates every time it crosses the fold is a tic, not a
 * flourish, and it makes long lists feel unstable.
 */
let riseObs=null;
function observeRise(){
  if(riseObs) riseObs.disconnect();
  if(!('IntersectionObserver' in window)) return;
  const els=[...app.querySelectorAll('.card,.bub')];
  // Anything already on screen at render time is shown immediately — animating
  // what the reader is already looking at reads as a delay, not as motion.
  const vh=window.innerHeight;
  riseObs=new IntersectionObserver((es,o)=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); o.unobserve(e.target); } });
  },{rootMargin:'0px 0px -8% 0px',threshold:.06});
  els.forEach(e=>{
    const t=e.getBoundingClientRect().top;
    if(t<vh*0.92){ e.classList.add('rise','in'); return; }
    e.classList.add('rise'); riseObs.observe(e);
  });
}

/**
 * Re-render, without throwing the reader back to the top.
 *
 * Every interaction rebuilds the whole view, and every rebuild used to jump to
 * the top of the page. On a thirty-item shopping list that means ticking off
 * what you already own fires you back to the header thirty times, and the app
 * feels like it is fighting you rather than like it is slow. Nothing here is a
 * performance fix — scrolling holds sixty frames a second on a throttled phone.
 * The scroll position was simply being thrown away.
 *
 * Three cases, because they want different things: a new screen starts at the
 * top, a new tab starts at the tab strip so the content you just asked for is
 * the first thing under your thumb, and everything else stays exactly where it
 * was.
 */
let lastScreen=null, lastTab=null;
/**
 * One navigation bar, always there.
 *
 * Eight rounds of features arrived as buttons in headers and strips that moved
 * around between screens, and a first-time user had no fixed thing to aim at.
 * Three destinations, in the same place, on every screen.
 */
function navBar(){
  const n=el('div','nav');
  [['tonight','🕕','Tonight'],['result','📅','Week'],['find','🔍','Search'],['scan','📷','Scan']].forEach(([k,ic,l])=>{
    const on=S.screen===k||(k==='result'&&(S.screen==='dish'&&S.cameFrom==='result'));
    const b=el('button',on?'on':'');
    b.innerHTML='<b>'+ic+'</b>'+esc(l);
    b.onclick=()=>{
      if(k==='result'&&!S.profile.skill){S.screen='q';S.q=0}
      else {S.screen=k; if(k==='find') S.query='';}
      render();
    };
    n.appendChild(b);
  });
  return n;
}

function render(){
  if(S.screen!=='scan') stopScan();
  const y=window.scrollY;
  const sameScreen=S.screen===lastScreen, sameTab=S.tab===lastTab;
  // every plate on the old screen is about to be discarded; if their tilt
  // subscribers are not dropped with them the listener list grows without bound
  tiltSubs=[];
  app.innerHTML='';
  app.appendChild(
    S.screen==='welcome'?welcome():
    S.screen==='q'?question():
    S.screen==='scan'?scanScreen():
    S.screen==='tonight'?tonightScreen():
    S.screen==='find'?findScreen():
    S.screen==='cook'?cookMode():
    S.screen==='account'?account():
    S.screen==='dish'?dish():result()
  );
  if(S.screen!=='welcome'&&S.screen!=='q'&&S.screen!=='cook') app.appendChild(navBar());
  lastScreen=S.screen; lastTab=S.tab;
  observeRise();
  if(!sameScreen){ window.scrollTo({top:0,behavior:'instant'}); return; }
  if(!sameTab){
    // Measured on the next frame, not this one. Read immediately after the
    // append, the strip's position is 24 px short of where it settles, so the
    // tab bar lands just off the top of the screen instead of at it.
    requestAnimationFrame(()=>{
      const strip=document.getElementById('tabstrip');
      if(!strip) return;
      const t=strip.getBoundingClientRect().top+window.scrollY-10;
      window.scrollTo({top:Math.max(0,t),behavior:'instant'});
    });
    return;
  }
  // clamp: the list can get shorter than where you were standing
  window.scrollTo({top:Math.min(y,Math.max(0,document.body.scrollHeight-window.innerHeight)),behavior:'instant'});
}
render();
authInit();

/* Offline shell. Only registered over http(s) — on file:// the API exists but
   throws, and the app is already fully offline there by virtue of being one file. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
}
})();
</script>
