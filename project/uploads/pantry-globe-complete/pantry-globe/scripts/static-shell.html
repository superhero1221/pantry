<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060d0a">
<title>Pantry — what should I cook?</title>
<meta name="description" content="Name a dish and a place. Real shops, live opening hours, honest basket costs, full macros and micros, and how to cook it.">
<!-- Installable when served over http(s); all four lines 404 harmlessly when the
     file is opened directly from disk, which must keep working. -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ================= palette =================
   Light by default, and that is a researched decision rather than a taste one.
   HelloFresh ships #FAF8F3, Green Chef #FBF9F0, Mindful Chef #FCF8ED, Cherrypick
   #F5F2F2 — four warm off-whites, and not one of the five biggest meal apps puts
   a dark background behind food. What IS well evidenced is contrast between the
   food and its ground, and warm light: dishes photographed under 3000K read as
   more appealing than under daylight or cool light. So the surround is warm and
   pale and the food carries the colour.

   Worth being precise about the limit of the evidence, because the folklore here
   is thick: a 448-person study found background colour did NOT significantly
   change appetite. Warm light and food-to-ground contrast are supported. "Green
   backgrounds suppress appetite" is not a thing. The dark theme is still one tap
   away and nothing about it is wrong — it just is not what the category does. */
:root{
  --bg:#faf6ee; --surface:#ffffff; --surface2:#f4eee2; --line:#e8dfd0; --line2:#d6c9b4;
  --text:#141815; --muted:#5c6a61; --dim:#7d8b83;
  --accent:#0d8552; --accent-soft:rgba(13,133,82,.10); --accent-line:rgba(13,133,82,.34);
  --warn:#a2650d; --bad:#bd3b2c;
  --plate:#e4d9c4; --plate2:#efe7d6; --plate-rim:rgba(90,70,40,.16);
  --shadow:0 1px 2px rgba(60,45,25,.05),0 12px 28px -18px rgba(60,45,25,.35);
  --glow:rgba(255,214,140,.30);
  --orb:radial-gradient(120% 110% at 32% 22%,rgba(255,250,238,1),rgba(243,235,220,1) 68%);
  --glass:linear-gradient(160deg,#ffffff,#f7f1e6);
  --r:20px;
}
[data-theme="dark"]{
  --bg:#060d0a; --surface:#0c1712; --surface2:#112019; --line:#1b3227; --line2:#264537;
  --text:#f0fbf5; --muted:#9bb5a6; --dim:#75907f;
  --accent:#35d68f; --accent-soft:rgba(53,214,143,.12); --accent-line:rgba(53,214,143,.42);
  --warn:#f5c451; --bad:#ff7a7a;
  --plate:#16241d; --plate2:#1d3128; --plate-rim:rgba(0,0,0,.5);
  --shadow:0 18px 40px -22px rgba(0,0,0,.95);
  --glow:rgba(53,214,143,.09);
  --orb:radial-gradient(120% 110% at 32% 22%,rgba(120,235,185,.20),rgba(10,24,18,.94) 62%);
  --glass:linear-gradient(160deg,rgba(28,52,42,.72),rgba(9,20,15,.82));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:16.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% -10%, var(--glow), transparent 60%)}
main{position:relative;z-index:1;touch-action:pan-y pinch-zoom;max-width:620px;margin:0 auto;padding:24px 18px calc(64px + env(safe-area-inset-bottom))}
h1{font-size:34px;line-height:1.06;margin:0;letter-spacing:-.038em;font-weight:800}
h2{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.028em;font-weight:760}
h3{font-size:18px;margin:0;font-weight:720;letter-spacing:-.018em}
p{margin:0}
.stack>*+*{margin-top:14px}
.stack-sm>*+*{margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card2{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.085em;color:var(--muted);font-weight:750}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:10px}
button,select,input{font:inherit;color:inherit;border:0;background:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border-radius:16px;padding:17px 18px;font-size:17px;font-weight:730;letter-spacing:-.015em;
  border:1px solid var(--line2);background:var(--surface2);cursor:pointer;transition:.16s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:11px 15px;font-size:15px;font-weight:700;border-radius:13px;width:auto}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px;justify-content:flex-start;width:auto}
/* --- onboarding option tiles --- */
.opt{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:.16s ease}
.opt:hover{border-color:var(--line2)}
.opt.on{background:var(--accent-soft);border-color:var(--accent-line)}
.opt .t{font-size:17.5px;font-weight:740;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt.on .t{color:var(--accent)}
.opt .s{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 19px;position:relative;transition:.16s}
.opt.on .tick{border-color:var(--accent);background:var(--accent)}
.opt.on .tick::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* --- progress --- */
.prog{display:flex;gap:5px;margin-bottom:26px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.3s}
.prog i.done{background:var(--accent)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:10px 15px;font-size:14.5px;font-weight:660;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.16s}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
select,input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--accent-line)}
.bar{height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .3s}
.note{border-radius:14px;padding:14px 15px;font-size:14px;line-height:1.5;font-weight:520}
.note.good{background:var(--accent-soft);color:var(--accent)}
.note.warn{background:rgba(245,196,81,.1);color:var(--warn)}
.note.tip{background:rgba(53,214,143,.08);color:var(--accent)}
.note.delta{background:rgba(245,196,81,.11);color:var(--warn)}
.item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;cursor:pointer;width:100%;text-align:left;transition:.13s}
.item:hover{background:rgba(255,255,255,.035)}
.item.own .nm{text-decoration:line-through;opacity:.4}
.big{font-size:38px;font-weight:800;letter-spacing:-.042em;line-height:1;margin-top:5px}
.step{display:flex;gap:13px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.n{flex:0 0 25px;height:25px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fade{animation:f .32s ease}
@keyframes f{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.src{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-right:1px}
.src.real-high{background:var(--accent)}
.src.real-med{background:var(--accent);opacity:.55}
.src.real-low{border:1.5px solid var(--accent);background:transparent}
.src.est{border:1.5px solid var(--line2);background:transparent}
.shop{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px;background:var(--accent)}
.dot.open{background:var(--accent)}
.dot.shut{background:var(--bad)}
.dot.unk{background:var(--line2)}
.cookstep{padding:26px 0}
.cooknum{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cooktext{font-size:25px;line-height:1.38;margin-top:14px;letter-spacing:-.02em;font-weight:560}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent);display:flex;gap:10px;max-width:620px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;max-width:620px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;
  border-radius:13px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:730;transition:.18s var(--ease)}
.nav button b{font-size:19px;line-height:1;font-weight:400}
.nav button.on{color:var(--accent)}
.nav button.on b{transform:translateY(-1px)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))!important}
/* ======================= exploded view =======================
   The McDonald's-advert effect: the dish holds together, then comes apart into
   its real ingredients, each one a photograph floating above the plate. Built
   in CSS 3D rather than WebGL because the whole app is one HTML file that has
   to work offline, and a real perspective transform on twelve images does the
   job that a 3D engine would do at a hundred times the weight. */
.x3d{perspective:1100px;perspective-origin:50% 46%;width:78%;margin:0 auto;aspect-ratio:1/1;
  position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.x3d .stack{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .8s var(--ease)}
.x3d .lay{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  transition:transform .85s var(--spring),opacity .4s var(--ease);will-change:transform}
.x3d .lay img{display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(50,35,15,.34))}
.x3d .base{border-radius:50%;overflow:hidden;box-shadow:0 26px 46px -22px rgba(40,28,12,.6)}
.x3d .base img{object-fit:cover;border-radius:50%}
.x3d .tag{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;max-width:44vw;
  background:var(--surface);border:1px solid var(--accent-line);border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:700;box-shadow:var(--shadow);
  opacity:0;transition:opacity .35s var(--ease) .15s;pointer-events:none}
.x3d .tag s{text-decoration:none;color:var(--muted);font-weight:600;margin-left:6px;font-size:11px}
.x3d.open .tag{opacity:1}
.x3d .hint{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12px;color:var(--dim)}
.hero{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;
  background:var(--surface2);box-shadow:var(--shadow)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cr{position:absolute;left:0;right:0;bottom:0;padding:22px 13px 9px;font-size:10px;
  color:rgba(255,255,255,.9);background:linear-gradient(transparent,rgba(0,0,0,.62))}
.hero .cr a{color:#fff}
.heroswap{display:flex;gap:7px;margin-top:9px}
.cam{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#000;position:relative}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;inset:22% 12%;border:2.5px solid var(--accent);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
.prod{display:flex;gap:14px;align-items:flex-start}
.prod img{width:88px;height:88px;object-fit:contain;border-radius:12px;background:#fff;flex:0 0 88px;
  border:1px solid var(--line)}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.ing{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:11px 9px 12px;text-align:center;cursor:pointer;transition:.18s var(--ease);box-shadow:var(--shadow)}
.ing:hover{border-color:var(--accent-line)}
.ing.on{border-color:var(--accent);background:var(--accent-soft)}
.ing .pic{width:100%;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ing .pic svg,.ing .pic img{width:100%;height:100%;object-fit:contain}
.ing .nm{font-size:12.5px;font-weight:680;line-height:1.2;margin-top:5px;letter-spacing:-.01em}
.ing .qt{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ing .sw{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  background:var(--accent);color:#fff;border-radius:999px;padding:2px 6px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* ============================ depth ============================
   The whole app sits in one perspective. Everything that lifts does so with the
   same spring and the same shadow growth, because inconsistent depth reads as
   cheap far faster than no depth at all. */
:root{ --spring:cubic-bezier(.32,1.5,.5,1); --ease:cubic-bezier(.22,1,.36,1); }
.scene{perspective:900px;perspective-origin:50% 42%}
.lift{transition:transform .5s var(--spring),box-shadow .5s var(--ease)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* meal bubble ------------------------------------------------------------ */
.bub{position:relative;width:100%;border:0;padding:0;background:none;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s var(--spring)}
.bub:active{transform:scale(.965)}
.bub .orb{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:var(--orb);
  box-shadow:var(--shadow),0 0 0 1px var(--line) inset;
  transition:box-shadow .5s var(--ease),transform .55s var(--spring)}
.bub:hover .orb{box-shadow:var(--shadow),0 0 0 1px var(--accent-line) inset}
/* the specular sweep is what sells glass; without it an orb reads as a flat circle */
.bub .orb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(58% 40% at 30% 14%,rgba(255,252,244,.55),transparent 62%)}
.bub .cap{margin-top:9px;text-align:center}
.bub .cap b{display:block;font-size:15px;font-weight:730;letter-spacing:-.015em;line-height:1.22}
.bub .cap s{display:block;text-decoration:none;font-size:12px;color:var(--muted);margin-top:3px;font-weight:560}
/* plate ------------------------------------------------------------------ */
.plate{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y pinch-zoom}
.plate .pl{transition:transform .62s var(--spring),opacity .38s var(--ease),filter .38s var(--ease);
  transform-box:fill-box;transform-origin:50% 50%}
.plate .pl.dim{opacity:.38;filter:saturate(.45) brightness(.8)}
.plate .pl.pick{cursor:pointer}
/* callout ---------------------------------------------------------------- */
.call{position:absolute;z-index:3;pointer-events:none;animation:pop .42s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.call .bx{max-width:min(62vw,240px);white-space:normal;background:var(--surface);border:1px solid var(--accent-line);border-radius:13px;
  padding:8px 11px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.call .bx u{display:block;text-decoration:none;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.call .bx b{font-size:15px;font-weight:680;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.call .bx i{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:5px}
.tapme{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font-size:11.5px;color:var(--dim);
  pointer-events:none;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.seg button{flex:1;border-radius:11px;padding:11px 6px;font-size:14px;font-weight:720;color:var(--muted);cursor:pointer;transition:.2s var(--ease)}
.seg button.on{background:var(--accent);color:#fff}
/* ===================== living in a small frame =====================
   The app is often first seen inside an embedded preview panel a few hundred
   pixels tall. Two things go wrong there. A swipe that reaches the end of this
   document chains into the host page, so the gesture is split and the app
   appears to move a few millimetres; overscroll-behavior stops the chaining and
   keeps the whole swipe here. And a layout tuned for a full phone screen leaves
   very little content visible at a time, which makes any amount of scrolling
   feel unproductive — so below 720 px of height everything tightens up. */
html{overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain}
@media (max-height:720px){
  main{padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
  .card{padding:14px;border-radius:16px}
  .stack>*+*{margin-top:10px}
  h1{font-size:22px} h2{font-size:18px}
  .big{font-size:23px}
  .btn{padding:12px 15px;font-size:14.5px}
  .bub .orb{max-width:118px;margin:0 auto}
  .bub .cap b{font-size:12px}
  .note{padding:10px 11px;font-size:12px}
  .prog{margin-bottom:16px}
  .opt{padding:12px 14px}
}
/* Scroll entrance. Cards settle in as they arrive rather than being there
   already — the app should feel like it is assembling itself under the thumb.
   Applied once and then forgotten, so scrolling back up does not re-run it. */
.rise{opacity:0;transform:translateY(18px) scale(.985);
  transition:opacity .5s var(--ease),transform .62s var(--spring)}
.rise.in{opacity:1;transform:none}
.swipehint{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11.5px;color:var(--dim);margin-top:10px}
.swipehint i{font-style:normal;animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(4px);opacity:.9}}
.daywrap{touch-action:pan-y}
@media (prefers-reduced-motion:reduce){
  .lift,.bub,.bub .orb,.plate .pl,.seg button,.rise{transition-duration:.01ms!important}
  .rise{opacity:1;transform:none}
  .call,.tapme{animation:none}
}
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>/*__ENGINE__*/</script>
<script>
(function(){
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=$('#app');

/** An <img> that survives having no pix/ folder next to it. */
function photoImg(src, remote, alt){
  const im=document.createElement('img');
  im.alt=alt||''; im.loading='lazy'; im.decoding='async';
  im.onerror=()=>{ if(remote && im.src!==remote){ im.onerror=null; im.src=remote; } };
  im.src=src;
  return im;
}

/* ------------------------------------------------------------- state ---- */
const S={
  screen:'welcome', q:0,
  profile:{skill:0,budget:0,time:0,adventure:0,diets:[],people:2},
  country:'GB', tier:1, days:5, kcal:2000, protein:120, seed:7, theme:'light',
  tab:'days', dishId:null, variantId:null, servings:2, dishTab:'shop', cookStep:0,
  pantry:new Set(), stores:null, shopMsg:null, place:null, placeBusy:false, off:new Set(), whyOpen:false, notesOpen:false, day:0, allDays:false, contribFor:null, query:'', cameFrom:'result', dishOpen:false, ingPick:null, view:'photo', exploded:false, scan:null, scanMsg:null, scanBusy:false, scanned:[], contribPick:false, tn:{protein:40,kcal:600,budget:8,minutes:30,skill:2,kit:['hob','oven','pan','pot','knife','board','kettle'],have:[]},
};
/* Theme is applied before first paint so the app never flashes the wrong
   background on open. */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.theme);
  const m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',S.theme==='dark'?'#060d0a':'#faf6ee');
}
try{ const t=localStorage.getItem('pg_theme'); if(t) S.theme=t; }catch(e){}
applyTheme();
try{
  const p=localStorage.getItem('pg_profile');
  if(p){ Object.assign(S.profile,JSON.parse(p)); if(S.profile.skill) S.screen='result'; }

async function authInit(){

  try{
    const {data}=await sb.auth.getSession();

    if(user) await pullRemote();
    sb.auth.onAuthStateChange((_e,sess)=>{ user=sess?sess.user:null; render(); });

async function pullRemote(){
  if(!sb||!user) return;
  try{
    const {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    if(prof){
      S.profile={skill:prof.skill,budget:prof.budget,time:prof.time_tier,adventure:prof.adventure,
                 diets:prof.diets||[],people:prof.people};
      S.country=prof.country||S.country;

    }
    const {data:pan}=await sb.from('pantry_items').select('ref').eq('user_id',user.id);
    if(pan) S.pantry=new Set(pan.map(x=>x.ref));
    save();
  }catch(e){}
}
async function pushRemote(){
  if(!sb||!user) return;
  try{
    await sb.from('profiles').upsert({
      id:user.id, skill:S.profile.skill||2, budget:S.profile.budget||2, time_tier:S.profile.time||2,
      adventure:S.profile.adventure||2, diets:S.profile.diets, people:S.profile.people,
      country:S.country, updated_at:new Date().toISOString(),
    });
    await sb.from('pantry_items').delete().eq('user_id',user.id);
    const rows=[...S.pantry].map(ref=>({user_id:user.id,ref}));
    if(rows.length) await sb.from('pantry_items').insert(rows);
    authMsg='Saved to your account.';
  }catch(e){ authMsg='Could not sync: '+e.message; }
  render();
}

function next(){ if(S.q<TOTAL_STEPS-1){S.q++;render()} else {S.screen='result';render()} }

function stepper(label,key,min,max,obj){
  const r=el('div','row'); r.innerHTML='<span class="lbl">'+esc(label)+'</span>';
  const b=el('div'); b.style.cssText='display:flex;gap:10px;align-items:center';
  const d=el('button','btn sm','−'),v=el('span','num'),i=el('button','btn sm','+');
  v.textContent=obj[key]; v.style.cssText='min-width:24px;text-align:center;font-weight:700;font-size:17px';
  d.onclick=()=>{obj[key]=Math.max(min,obj[key]-1);save();render()};
  i.onclick=()=>{obj[key]=Math.min(max,obj[key]+1);save();render()};
  b.append(d,v,i); r.appendChild(b); return r;
}

function result(){
  const v=el('div','stack fade');

  // header

  const acts=el('div'); acts.style.cssText='display:flex;gap:8px';
  const th=el('button','btn sm', S.theme==='dark'?'☀':'☾');

  acct.onclick=()=>{S.screen='account';authMsg=null;render()};
  const fnd=el('button','btn sm','🔍');
  fnd.title='Find a single dish'; fnd.setAttribute('aria-label',fnd.title);
  fnd.onclick=()=>{S.screen='find';S.query='';render()};
  const edit=el('button','btn sm','Edit');
  edit.onclick=()=>{S.screen='q';S.q=0;render()};
  acts.appendChild(th); acts.appendChild(acct); acts.appendChild(edit);
  head.appendChild(acts); v.appendChild(head);

  // what the answers did
  // Collapsed by default. This is reference material you read once; leaving it
  // open put a full screen of explanation between opening the app and seeing any
  // food, which is the wrong thing to make someone scroll past every time.
  const why=el('div','card');
  const lines=PG.explainProfile({skill:P.skill||4,budget:P.budget||4,time:P.time||4,adventure:P.adventure||4,diets:P.diets,people:P.people},res.allowed,res.total);
  const head2=el('button','row'); head2.style.cssText='width:100%;text-align:left;cursor:pointer;background:none;border:0;padding:0';
  head2.innerHTML='<span><span class="lbl">What your answers changed</span>'+
    '<p class="muted" style="font-size:12.5px;margin-top:4px">'+res.allowed+' of '+res.total+' dishes fit'+(res.mealsPerDay>2?' · '+res.mealsPerDay+' meals a day':'')+'</p></span>'+
    '<span style="color:var(--accent);font-size:13px">'+(S.whyOpen?'Hide':'Details')+'</span>';
  head2.onclick=()=>{S.whyOpen=!S.whyOpen;render()};
  why.appendChild(head2);
  if(S.whyOpen){
    const ul=el('div'); ul.style.marginTop='12px';
    lines.forEach(t=>{ const q=el('p','muted'); q.style.cssText='font-size:13px;padding-left:15px;position:relative;margin-top:5px';
      q.innerHTML='<span style="position:absolute;left:0;color:var(--accent)">·</span>'+esc(t); ul.appendChild(q); });
    why.appendChild(ul);
    if(res.mealsPerDay>2){ why.appendChild(el('p','note good',esc(res.reason))).style.marginTop='12px'; }
  }
  v.appendChild(why);

  if(!res.plan){ v.appendChild(el('p','note warn',esc(res.reason||'Nothing fits those answers together. Loosen one and try again.'))); return v; }
  const plan=res.plan;

  // headline
  const h=el('div','card');
  h.appendChild(el('div','row','<div><span class="lbl">Whole shop</span><p class="big">'+money(plan.firstCook)+'</p></div>'+
    '<div style="text-align:right"><span class="lbl">Per serving</span><p class="big" style="color:var(--accent)">'+money(plan.perMeal)+'</p></div>'));
  const sm=el('div'); sm.style.cssText='border-top:1px solid var(--line);margin-top:15px;padding-top:13px;font-size:13.5px';
  // Three figures, not six. The rest is a tap away in the tabs, where someone
  // who wants it has gone looking for it.
  sm.innerHTML=row('Average per day',Math.round(plan.avg.kcal)+' kcal · '+Math.round(plan.avg.protein)+' g protein','muted');
  h.appendChild(sm);
  // benchmark: what that per-serving figure is actually up against
  const bl=PG.benchmark(plan.perMeal,country());
  const hd=PG.headline(bl,plan.perMeal,money);
  h.appendChild(el('p','note '+hd.kind,esc(hd.text))).style.marginTop='13px';
  // Warnings first — a budget overrun matters more than a fibre compliment — and
  // only the first one until asked. Five stacked notes is another screen of
  // reading stacked on top of the thing you came here for.
  const notes=[];
  if(plan.overlapSaving>0.5) notes.push({kind:'good',text:'Shopping for these '+(plan.days.length*res.mealsPerDay)+' meals one at a time would cost '+money(plan.naiveFirstCook)+'. Planned together they share '+plan.sharedItems+' ingredients, so the same food comes to '+money(plan.firstCook)+'.'});
  plan.notes.forEach(n=>notes.push(n));
  notes.sort((a,b)=>(a.kind==='warn'?0:1)-(b.kind==='warn'?0:1));
  const shown=S.notesOpen?notes:notes.slice(0,1);
  shown.forEach(n=>h.appendChild(el('p','note '+(n.kind==='good'?'good':'warn'),esc(n.text))).style.marginTop='11px');
  if(notes.length>1){
    const more=el('button','btn ghost',S.notesOpen?'Fewer notes':'+ '+(notes.length-1)+' more note'+(notes.length===2?'':'s'));
    more.style.cssText='font-size:12.5px;margin-top:6px;padding:6px 2px';
    more.onclick=()=>{S.notesOpen=!S.notesOpen;render()};
    h.appendChild(more);
  }
  v.appendChild(h);

  const shuffle=el('button','btn','🎲 Different week, same answers');
  shuffle.onclick=()=>{S.seed++;render()}; v.appendChild(shuffle);

  const tabs=el('div','grid'); tabs.id='tabstrip'; tabs.style.gridTemplateColumns='repeat(5,1fr)'; tabs.style.gap='7px';
  [['days','Days'],['shop','List'],['where','Where'],['left','Left'],['nutrition','Health']].forEach(([k,l])=>{
    const b=el('button','btn sm'+(S.tab===k?' primary':'')); b.style.cssText='width:100%;padding:10px 4px;font-size:13px'; b.textContent=l;
    b.onclick=()=>{S.tab=k;render()}; tabs.appendChild(b);
  });
  v.appendChild(tabs);

  if(S.tab==='days'){
    /**
     * One day at a time, by default.
     *
     * Five stacked day cards is two thousand pixels of page, and in an embedded
     * frame — where there is no flick momentum and a swipe covers very little —
     * that is a long way to travel to reach Friday. The best answer to "I cannot
     * scroll far" is to need less scrolling: a day selector turns the whole week
     * into one tap instead of four swipes. Anyone who wants the old continuous
     * view can still have it.
     */
    const sel=el('div','scroll'); sel.style.marginBottom='2px';
    plan.days.forEach((d,i)=>{
      const b=el('button','chip'+(!S.allDays&&S.day===i?' on':''));
      b.innerHTML='Day '+(i+1)+'<span class="muted" style="margin-left:7px;font-size:11px">'+Math.round(d.totals.kcal)+'</span>';
      b.onclick=()=>{S.allDays=false;S.day=i;render()};
      sel.appendChild(b);
    });
    const all=el('button','chip'+(S.allDays?' on':''),'All '+plan.days.length+' days');
    all.onclick=()=>{S.allDays=!S.allDays;render()};
    sel.appendChild(all);
    v.appendChild(sel);
    if(S.day>=plan.days.length) S.day=0;

    /**
     * Swipe left and right to change day.
     *
     * Bound on a wrapper rather than on the cards, and only acted on when the
     * gesture is decisively horizontal — a 2:1 ratio against the vertical
     * movement, past a 45 px threshold. Anything looser steals the start of a
     * scroll, which is far more annoying than a swipe that occasionally does not
     * register. touch-action stays pan-y so the browser keeps owning vertical.
     */
    const wrap=el('div','daywrap stack-sm');
    if(!S.allDays && plan.days.length>1){
      let x0=0,y0=0,live=false;
      wrap.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;live=true});
      wrap.addEventListener('pointerup',e=>{
        if(!live) return; live=false;
        const dx=e.clientX-x0, dy=e.clientY-y0;
        if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*2) return;
        const next=S.day+(dx<0?1:-1);
        if(next<0||next>=plan.days.length) return;
        S.day=next; render();
      });
      wrap.addEventListener('pointercancel',()=>{live=false});
    }
    v.appendChild(wrap);

    plan.days.forEach((d,i)=>{
      if(!S.allDays && i!==S.day) return;
      const c=el('div','card stack-sm');
      c.appendChild(el('div','row','<h3>Day '+(i+1)+'</h3><span class="num muted" style="font-size:12px">'+Math.round(d.totals.kcal)+' kcal · '+Math.round(d.totals.protein)+' g P</span>'));
      // meals as bubbles: each one holds its own dish, drawn from its own
      // ingredients, so the week reads as food rather than as a list of titles
      const orbs=el('div','grid scene');
      orbs.style.cssText='grid-template-columns:repeat('+Math.min(d.meals.length,3)+',1fr);gap:14px;margin-top:4px';
      d.meals.forEach(m=>{
        const r=byId(m.recipeId); if(!r) return;
        const vr=m.variantId?r.variants.find(x=>x.id===m.variantId):null;
        const b=el('button','bub');
        const orb=el('div','orb');
        const ph=PG.dishPhoto(r.id);
        if(ph){ const im=photoImg(ph,PG.DISH_REMOTE[r.id],'');
          im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover'; orb.appendChild(im); }
        else { const api=plate(PG.applyVariant(r,m.variantId),{spread:.86,flat:true});
          api.node.style.cssText='position:absolute;inset:1%;width:98%'; orb.appendChild(api.node); attachTilt(b,api); }
        b.appendChild(orb);
        b.appendChild(el('div','cap','<b>'+esc(r.name)+'</b><s>'+(vr?esc(vr.label)+' · ':'')+
          (r.totalMin>=120?Math.round(r.totalMin/60)+' h':r.totalMin+' min')+'</s>'));
        b.onclick=()=>{S.dishId=r.id;S.variantId=m.variantId;S.dishTab='shop';S.off=new Set();S.cameFrom='result';S.screen='dish';render()};
        orbs.appendChild(b);
      });
      c.appendChild(orbs);
      wrap.appendChild(c);
    });
    if(!S.allDays && plan.days.length>1)
      wrap.appendChild(el('div','swipehint','<i>‹</i> swipe to change day <i>›</i>'));
    if(res.excluded.length){
      const x=el('div','card');
      x.innerHTML='<span class="lbl">Hidden by your answers ('+res.excluded.length+')</span>';
      const w=el('div'); w.style.cssText='margin-top:10px;display:flex;flex-wrap:wrap;gap:6px';
      res.excluded.slice(0,10).forEach(e=>w.appendChild(el('span','pill',esc(e.recipe.name)+' — '+esc(e.why))));
      x.appendChild(w);
      x.appendChild(el('p','muted','Hidden, not deleted. Change an answer above and they come back.')).style.cssText='font-size:11.5px;margin-top:10px';
      v.appendChild(x);

/* ============================================================== plate ====
   Draws a dish as stacked layers of vector food. One <g> per ingredient, so
   removing one genuinely removes it and every label still points at something
   real. Geometry comes from lib/visual.ts; this file only paints it. */
const NS='http://www.w3.org/2000/svg';
const sv=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};

/* One hex per ingredient; the lit and shaded sides are derived from it so the
   whole plate is lit from the same direction without storing three colours.

   Derived in RGB, deliberately. Doing it in HSL looks right until a near-white
   ingredient arrives: #fafaf4 is nominally hue 60 at 43% saturation, so dropping
   its lightness by 13 turns semi-skimmed milk into butter yellow. Mixing toward
   white and multiplying toward black keeps the hue where it was. */
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const hex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const shade=(c,d)=>{const p=rgb(c);
  return d>=0 ? hex(p.map(v=>v+(255-v)*(d/100))) : hex(p.map(v=>v*(1+d/100)));};

function shapeFor(form,p,fill){
  const r=p.r, x=p.x, y=p.y, rot='rotate('+p.rot.toFixed(1)+' '+x.toFixed(2)+' '+y.toFixed(2)+')';
  switch(form){
    // Near-opaque: at .85 a pale sauce picked up the green of the plate beneath
    // and read as an olive disc rather than as béchamel.
    case 'pool':   return sv('ellipse',{cx:50,cy:53,rx:r,ry:r*0.6,fill:fill,opacity:.96});
    case 'dome':   return sv('ellipse',{cx:x,cy:y,rx:r,ry:r*0.66,fill:fill});
    case 'strand':{
      const a=(p.k*360)*Math.PI/180, dx=Math.cos(a)*r, dy=Math.sin(a)*r*0.55;
      return sv('path',{d:'M'+(x-dx)+' '+(y-dy)+' Q'+(x+dy*1.6)+' '+(y-dx*0.5)+' '+(x+dx)+' '+(y+dy),
        stroke:fill,'stroke-width':(r*0.22).toFixed(2),'stroke-linecap':'round',fill:'none'});
    }
    case 'slab':   return sv('rect',{x:x-r,y:y-r*0.5,width:r*2,height:r,rx:r*0.26,fill:fill,transform:rot});
    case 'chunk':  return sv('rect',{x:x-r,y:y-r*0.82,width:r*2,height:r*1.64,rx:r*0.42,fill:fill,transform:rot});
    case 'round':  return sv('circle',{cx:x,cy:y,r:r,fill:fill});
    case 'wedge':  return sv('path',{d:'M'+x+' '+(y-r)+' A'+r+' '+r+' 0 0 1 '+x+' '+(y+r)+' Q'+(x-r*0.35)+' '+y+' '+x+' '+(y-r)+'Z',fill:fill,transform:rot});
    case 'bean':   return sv('ellipse',{cx:x,cy:y,rx:r,ry:r*0.72,fill:fill,transform:rot});
    case 'leaf':   return sv('path',{d:'M'+(x-r)+' '+y+' Q'+x+' '+(y-r*0.85)+' '+(x+r)+' '+y+' Q'+x+' '+(y+r*0.85)+' '+(x-r)+' '+y+'Z',fill:fill,transform:rot});
    case 'shred':  return sv('rect',{x:x-r,y:y-r*0.19,width:r*2,height:r*0.38,rx:r*0.19,fill:fill,transform:rot});
    default:       return sv('circle',{cx:x,cy:y,r:Math.max(.5,r),fill:fill});
  }
}

/**
 * Build a plate.
 *
 * `explode` lifts each layer by its own index rather than a fixed step, so a
 * dish with four ingredients separates as clearly as one with twenty. Focus
 * dims everything else rather than hiding it — hiding the rest of the plate
 * loses the sense of proportion that makes the number mean anything.
 */
let plateSeq=0;
function plate(items,opts){
  opts=opts||{};
  const uid='p'+(plateSeq++)+'_';
  const layers=PG.plateLayers(items,{spread:opts.spread||1});
  const svg=sv('svg',{class:'plate',viewBox:'2 14 96 78',role:'img'});
  svg.setAttribute('aria-label','Illustration of the dish, one layer per ingredient');
  const defs=sv('defs',{});
  const f=sv('filter',{id:uid+'shadow',x:'-40%',y:'-40%',width:'180%',height:'180%'});
  f.appendChild(sv('feDropShadow',{dx:0,dy:2.4,stdDeviation:3.2,'flood-color':'#4a3418','flood-opacity':.20}));
  defs.appendChild(f);
  svg.appendChild(defs);

  // the plate itself, in the same perspective as the scatter
  const dish=sv('g',{});
  if(opts.bare) dish.setAttribute('style','display:none');
  dish.appendChild(sv('ellipse',{cx:50,cy:55,rx:46,ry:29,fill:'var(--plate)',filter:'url(#'+uid+'shadow)'}));
  dish.appendChild(sv('ellipse',{cx:50,cy:53.5,rx:40,ry:24,fill:'var(--plate2)'}));
  svg.appendChild(dish);

  const groups=[];
  layers.forEach((L,i)=>{
    const id=uid+'lg'+i;
    const gr=sv('linearGradient',{id:id,x1:'0',y1:'0',x2:'.35',y2:'1'});
    gr.appendChild(sv('stop',{offset:'0','stop-color':shade(L.color,9)}));
    gr.appendChild(sv('stop',{offset:'1','stop-color':shade(L.color,-9)}));
    defs.appendChild(gr);
    const g=sv('g',{class:'pl'+(opts.onPick?' pick':''),'data-ref':L.ref});

    const pic=opts.photos?PG.PHOTOS[L.ref]:null;
    if(pic){
      // Photograph in place of the drawn form. Still one layer per ingredient,
      // so lifting it off still lifts it off.
      L.pieces.slice(0,Math.min(L.pieces.length,7)).forEach(p=>{
        const s=p.r*2.4;
        const im=sv('image',{href:pic,x:(p.x-s/2).toFixed(2),y:(p.y-s/2).toFixed(2),
          width:s.toFixed(2),height:s.toFixed(2),preserveAspectRatio:'xMidYMid meet'});
        im.setAttribute('transform','rotate('+(p.rot*0.15).toFixed(1)+' '+p.x.toFixed(2)+' '+p.y.toFixed(2)+')');
        g.appendChild(im);
      });
      if(opts.onPick){ g.style.cursor='pointer'; g.addEventListener('click',ev=>{ev.stopPropagation();opts.onPick(L.ref)}); }
      svg.appendChild(g); groups.push({L:L,g:g,i:i});
      return;
    }
    L.pieces.forEach(p=>{
      g.appendChild(shapeFor(L.form,p,'url(#'+id+')'));
      // a single specular dot per piece is what stops vector food reading as flat

    });
    if(opts.onPick){
      g.style.cursor='pointer';
      g.addEventListener('click',ev=>{ev.stopPropagation();opts.onPick(L.ref)});
    }
    svg.appendChild(g); groups.push({L:L,g:g,i:i});
  });

  const api={node:svg,layers:layers,groups:groups,explode:0,focus:null,tilt:{x:0,y:0}};
  api.paint=()=>{
    const n=Math.max(groups.length,1);
    groups.forEach(({L,g,i})=>{
      const t=(i+1)/n;
      // Two separate gestures, and conflating them was wrong. Exploding lifts and
      // fans EVERY layer, for looking at the construction. Focusing plucks only
      // the chosen layer out and leaves the rest of the dish where it is —
      // lifting everything to highlight one thing just reads as debris, and it
      // destroys the sense of proportion that makes the number worth showing.
      const lift=api.explode*t*46;
      const fan=api.explode*(i%2?1:-1)*t*13;
      const on=api.focus===L.ref;
      const px=api.tilt.x*(0.4+t*1.5)+fan, py=api.tilt.y*(0.4+t*1.5);
      g.style.transform='translate('+px.toFixed(2)+'px,'+(-lift-(on?10:0)+py).toFixed(2)+'px)'+(on?' scale(1.07)':'');
      g.classList.toggle('dim', !!api.focus && !on);
    });
  };
  api.setExplode=v=>{api.explode=v;api.paint()};
  api.setFocus=r=>{api.focus=r;api.paint()};
  api.setTilt=(x,y)=>{api.tilt={x:x,y:y};api.paint()};
  api.paint();
  return api;
}

/* Pointer and device tilt drive the same two numbers, so the plate behaves the
   same whether it is a phone being turned or a mouse being moved. */
let tiltBound=false; let tiltSubs=[];
function attachTilt(host,api){
  let raf=0;
  const set=(x,y)=>{ if(raf)return; raf=requestAnimationFrame(()=>{raf=0;api.setTilt(x,y)}); };
  host.addEventListener('pointermove',e=>{
    // Mouse only. On a touch screen this same event fires while the user is
    // scrolling, so a drag down the page would repaint every plate it passed.
    if(e.pointerType&&e.pointerType!=='mouse') return;
    const b=host.getBoundingClientRect();
    set(((e.clientX-b.left)/b.width-.5)*-7,((e.clientY-b.top)/b.height-.5)*-5);
  });
  host.addEventListener('pointerleave',()=>set(0,0));
  if(window.DeviceOrientationEvent&&!tiltBound){
    tiltBound=true;
    window.addEventListener('deviceorientation',e=>{
      if(e.gamma==null)return;
      const x=Math.max(-9,Math.min(9,e.gamma/4)), y=Math.max(-6,Math.min(6,((e.beta||0)-42)/6));
      tiltSubs.forEach(fn=>fn(-x,-y));
    });
  }
  tiltSubs.push((x,y)=>api.setTilt(x,y));
}

/* -------------------------------------------------------- leftovers ---- */
const g2=n=>n>=1000?(n/1000).toFixed(n%1000?1:0)+' kg':Math.round(n)+' g';

function leftoversView(plan,bl,servings){
  const w=el('div','stack');
  const rep=PG.leftovers(plan.shopping,plan.firstCook);
  const P=S.profile;

  /* --- pack economics: the point of the tab --- */
  const intro=el('div','card');
  intro.innerHTML='<span class="lbl">What the shop actually buys</span>'+
    '<p class="muted" style="font-size:13px;margin-top:8px;line-height:1.55">A meal kit ships the exact grams and leaves you nothing. A shop sells whole packs, '+
    'so the first bill is higher and the second is not. This is that difference, split into the part you keep and the part that spoils.</p>';
  const bar=el('div'); bar.style.cssText='margin-top:14px';
  // the eaten share is the plan's own marginal figure, not firstCook minus the
  // surplus — otherwise this bar and the shopping tab would quote two slightly
  // different numbers for the same thing
  const eaten=Math.min(plan.marginal,plan.firstCook);
  const pc=n=>plan.firstCook>0?(n/plan.firstCook*100):0;
  bar.innerHTML='<div style="display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--surface2)">'+
    '<i style="width:'+pc(eaten)+'%;background:var(--accent)"></i>'+
    '<i style="width:'+pc(rep.stockValue)+'%;background:var(--accent);opacity:.42"></i>'+
    '<i style="width:'+pc(rep.perishableValue)+'%;background:var(--warn)"></i></div>'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:12px">'+
    '<span style="display:flex;align-items:center;gap:6px"><span class="src real-high"></span>eaten this week '+money(eaten)+'</span>'+
    '<span style="display:flex;align-items:center;gap:6px"><span class="src real-med"></span>cupboard stock '+money(rep.stockValue)+'</span>'+
    '<span style="display:flex;align-items:center;gap:6px"><span class="src" style="background:var(--warn)"></span>fresh, unfinished '+money(rep.perishableValue)+'</span>'+
    '</div>';
  intro.appendChild(bar);
  PG.packEconomics(plan.firstCook,plan.marginal,rep,money)
    .forEach(n=>intro.appendChild(el('p','note '+n.kind,esc(n.text))).style.marginTop='11px');
  w.appendChild(intro);

  /* --- the benchmark ladder, in full --- */
  const bm=el('div','card');
  bm.innerHTML='<span class="lbl">Per serving, against the alternatives</span>';
  const tbl=el('div'); tbl.style.marginTop='11px';
  const mine=el('div'); mine.style.cssText='display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)';
  mine.innerHTML='<span style="font-weight:620">Cooking this plan</span><span class="num" style="font-weight:680;color:var(--accent)">'+money(plan.perMeal)+'</span>';
  tbl.appendChild(mine);
  bl.forEach(l=>{
    const d=el('div'); d.style.cssText='padding:11px 0;border-bottom:1px solid var(--line)';
    d.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px">'+
      '<span style="font-size:13.5px">'+esc(l.label)+'</span>'+
      '<span class="num" style="font-size:13.5px;color:'+(l.beats?'var(--muted)':'var(--warn)')+'">'+
        money(l.low)+(l.high>l.low?'–'+money(l.high):'')+'</span></div>'+
      '<p class="muted" style="font-size:11.5px;margin-top:5px;line-height:1.45">'+esc(l.blurb)+'</p>'+
      '<p style="font-size:11.5px;margin-top:5px;color:'+(l.beats?'var(--accent)':'var(--warn)')+'">'+
        (l.beats?Math.round(l.share*100)+'% cheaper — '+money(l.saving)+' a serving, '+money(l.saving*servings)+' across this plan'
               :money(-l.saving)+' a serving more expensive')+'</p>';
    tbl.appendChild(d);
  });
  bm.appendChild(tbl);
  bm.appendChild(el('p','muted','Compared on the value of food actually eaten, not the first bill — a kit leaves you no cupboard, so comparing its price against a shop that stocks one would flatter us. Benchmarks are published UK prices as of '+PG.BENCHMARK_DATE+', scaled to '+esc(country().name)+'.'))
    .style.cssText='font-size:11.5px;margin-top:12px;line-height:1.55';
  w.appendChild(bm);

  /* --- what has to be used --- */
  if(rep.perishableLines.length){
    const c=el('div','card');
    c.appendChild(el('div','row','<h3>Use these first</h3><span class="num" style="font-size:14px;font-weight:640;color:var(--warn)">'+money(rep.perishableValue)+'</span>'));
    c.appendChild(el('p','muted','Fresh food the plan does not finish. Ordered by what is worth most, not by what is biggest.')).style.cssText='font-size:12.5px;margin-top:7px';
    const l=el('div'); l.style.marginTop='9px';
    rep.perishableLines.slice(0,10).forEach(x=>{
      const d=el('div'); d.style.cssText='display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line)';
      d.innerHTML='<span class="dot" style="background:var(--warn);margin:0"></span>'+
        '<span style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.name)+'</span>'+
        '<span class="muted num" style="font-size:12px">'+g2(x.gramsLeft)+' of '+g2(x.gramsBought)+'</span>'+
        '<span class="num" style="min-width:58px;text-align:right;font-size:13.5px;font-weight:600">'+money(x.value)+'</span>';
      l.appendChild(d);
    });
    c.appendChild(l);
    w.appendChild(c);
  }

  /* --- what carries forward --- */
  if(rep.stockLines.length){
    const c=el('div','card');
    c.appendChild(el('div','row','<h3>Stays in the cupboard</h3><span class="num" style="font-size:14px;font-weight:640;color:var(--accent)">'+money(rep.stockValue)+'</span>'));
    c.appendChild(el('p','muted','Rice, spices, oil and pulses keep for months. You paid for this once; every later plan that uses them is cheaper because of it.')).style.cssText='font-size:12.5px;margin-top:7px';
    const box=el('div'); box.style.cssText='margin-top:11px;display:flex;flex-wrap:wrap;gap:6px';
    rep.stockLines.slice(0,16).forEach(x=>box.appendChild(el('span','pill',esc(x.name)+' · '+g2(x.gramsLeft))));
    if(rep.stockLines.length>16) box.appendChild(el('span','pill','+'+(rep.stockLines.length-16)+' more'));
    c.appendChild(box);
    const mark=el('button','btn sm','Mark all of this as stocked');
    mark.style.cssText='width:100%;margin-top:13px';
    mark.title='Adds them to your pantry so the next plan does not charge you for them again';
    mark.onclick=()=>{rep.stockLines.forEach(x=>S.pantry.add(x.ref));save();render()};
    c.appendChild(mark);
    w.appendChild(c);
  }

  /* --- what the surplus could cook next --- */
  const nx=PG.nextFromLeftovers(rep,country(),S.tier,P.people||2,P.diets,S.pantry);
  const n=el('div','card');
  n.appendChild(el('h3',null,'What this could make next'));
  n.appendChild(el('p','muted','Ranked by how little more it costs, because that is the question — not which recipe happens to mention coriander.')).style.cssText='font-size:12.5px;margin-top:7px';
  if(!nx.length){
    n.appendChild(el('p','note warn','Nothing in the surplus gets far enough into another dish to be worth listing. That is usually a sign the plan is already using its packs well.')).style.marginTop='11px';
  } else {
    const l=el('div'); l.style.marginTop='10px';
    nx.forEach(x=>{
      const b=el('button','item'); b.style.cssText='background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:8px;align-items:flex-start';
      b.innerHTML='<span style="flex:1;min-width:0">'+
        '<span style="display:block;font-size:14.5px;font-weight:580">'+esc(x.name)+'</span>'+
        '<span class="muted" style="font-size:12px">'+x.covered+' of '+x.total+' ingredients already in · '+
          (x.totalMin>=120?Math.round(x.totalMin/60)+' h':x.totalMin+' min')+'</span>'+
        (x.missing.length?'<span class="muted" style="display:block;font-size:11.5px;margin-top:5px">still need '+esc(x.missing.map(m=>m.name.toLowerCase()).join(', '))+'</span>':'')+
        '</span>'+
        '<span style="text-align:right;flex:0 0 auto"><span class="num" style="display:block;font-size:15px;font-weight:660;color:var(--accent)">'+
          (x.extraCost<0.01?'free':'+'+money(x.extraCost))+'</span><span class="muted" style="font-size:11px">'+(P.people||2)+' servings</span></span>';
      b.onclick=()=>{S.dishId=x.recipeId;S.variantId=null;S.dishTab='shop';S.off=new Set();S.screen='dish';render()};
      l.appendChild(b);
    });
    n.appendChild(l);
  }
  w.appendChild(n);

  return w;
}

/* ------------------------------------------------------ where to buy ---- */
function whereToBuy(plan){
  const w=el('div','stack');
  const route=PG.shoppingRoute(plan.shopping.filter(i=>!S.pantry.has(i.ref)));

  const intro=el('div','card');
  intro.innerHTML='<span class="lbl">Where this list is best bought</span>'+
    '<p class="muted" style="font-size:13px;margin-top:8px;line-height:1.5">Grouped by the kind of shop, biggest spend first — so you can see which single detour is actually worth making rather than being sent to five shops.</p>';
  w.appendChild(intro);

  route.forEach(g=>{
    const c=el('div','card');
    c.appendChild(el('div','row','<h3>'+esc(g.label)+'</h3><span class="num" style="font-size:14px;font-weight:640;color:var(--accent)">'+money(g.total)+'</span>'));
    if(g.why) c.appendChild(el('p','note good',esc(g.why))).style.marginTop='10px';
    const list=el('div'); list.style.cssText='margin-top:10px;display:flex;flex-wrap:wrap;gap:6px';
    g.items.slice(0,14).forEach(i=>list.appendChild(el('span','pill',esc(i.name))));
    if(g.items.length>14) list.appendChild(el('span','pill','+'+(g.items.length-14)+' more'));
    c.appendChild(list);
    w.appendChild(c);
  });

  // live shops
  const live=el('div','card stack-sm');
  live.appendChild(el('h3',null,'Real shops near you'));
  const box=el('div');
  if(S.stores===null && !S.shopMsg){
    const b=el('button','btn','📍 Find shops near me');
    b.onclick=()=>findShops(route);
    box.appendChild(b);
    box.appendChild(el('p','muted','Uses OpenStreetMap. Nothing is sent anywhere — your location stays on this device.'));
    box.lastChild.style.cssText='font-size:11.5px;margin-top:9px';
  } else if(S.shopMsg){
    box.appendChild(el('p','note warn',esc(S.shopMsg)));
  } else {
    const wanted=new Set(route.map(g=>g.kind));
    const matched=S.stores.filter(x=>wanted.has(x.kind));
    const rest=S.stores.filter(x=>!wanted.has(x.kind));
    const open=S.stores.filter(x=>x.open===true).length;
    box.appendChild(el('p','lbl',S.stores.length+' within 3 km · '+open+' open now'));
    [...matched,...rest].slice(0,14).forEach(x=>{
      const d=el('div','shop');
      d.innerHTML='<span class="dot '+(x.open===true?'open':x.open===false?'shut':'unk')+'"></span>'+
        '<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:560">'+esc(x.name)+'</span>'+
        '<span class="muted" style="font-size:12px">'+esc(PG.SHOP_LABEL[x.kind]||x.kind)+' · '+x.dist.toFixed(1)+' km'+
        (x.open===true&&x.closes?' · closes '+esc(x.closes):x.open===false?' · closed now':' · hours not mapped')+
        (wanted.has(x.kind)?' · <span style="color:var(--accent)">on your list</span>':'')+'</span></span>'+
        '<a href="https://www.openstreetmap.org/?mlat='+x.lat+'&mlon='+x.lon+'#map=18/'+x.lat+'/'+x.lon+'" target="_blank" rel="noreferrer" class="pill" style="align-self:center">map</a>';
      box.appendChild(d);
    });
    if(!matched.length) box.appendChild(el('p','note warn','None of the shop types your list needs are mapped nearby — a general supermarket will cover everything, just not at the best price.')).style.marginTop='10px';
  }
  live.appendChild(box);
  w.appendChild(live);
  return w;
}

/* --------------------------------------------------------- where you are ---- */
/* One position fix, turned into a place name and a country, so prices arrive in
   the right currency without anyone picking their own country off a list of 60.
   Nothing is sent anywhere: the coordinates go to OpenStreetMap's public
   reverse-geocoder and the answer stays on the device.

   Geolocation is refused outright by every browser on an insecure page, which
   is the real reason this only works once the app is on an https address. */

function position(opts){
  return new Promise((ok,no)=>{
    if(!navigator.geolocation) return no({code:0});
    navigator.geolocation.getCurrentPosition(p=>ok(p), e=>no(e),
      Object.assign({timeout:12000, maximumAge:300000, enableHighAccuracy:false}, opts||{}));
  });
}

const GEO_FAIL={0:'This browser cannot do location.',
  1:'Location permission was declined — you can still pick a country by hand.',
  2:'No location fix. Usually means no signal indoors.',
  3:'Location timed out.'};

/** Coordinates -> {label, code}. Returns null rather than guessing. */
async function placeOf(lat,lon){
  const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1'
        +'&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch(u,{signal:c.signal,headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    const j=await r.json(), a=j.address||{};
    const town=a.city||a.town||a.village||a.suburb||a.county||a.state||'';
    const code=(a.country_code||'').toUpperCase();
    return {label:[town,a.country].filter(Boolean).join(', ')||j.display_name||'somewhere',
            code: PG.COUNTRIES[code]?code:null, lat, lon};
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

/** The country the browser itself thinks it is in. No network, no permission. */
function localeCountry(){
  try{
    for(const l of (navigator.languages||[navigator.language||''])){
      const m=/[-_]([A-Za-z]{2})$/.exec(l);
      if(m && PG.COUNTRIES[m[1].toUpperCase()]) return m[1].toUpperCase();
    }
  }catch(e){}
  return null;
}

async function locate(){
  S.placeBusy=true; S.shopMsg=null; render();
  try{
    const pos=await position();
    const p=await placeOf(pos.coords.latitude,pos.coords.longitude);
    if(!p){
      // Position fix worked, the map lookup did not. The phone's own region
      // setting is a worse answer than coordinates but a much better one than
      // leaving the prices in the wrong currency.
      const g=localeCountry();
      if(g){ S.country=g; S.place={label:PG.COUNTRIES[g].name, code:g,
                                   lat:pos.coords.latitude, lon:pos.coords.longitude, rough:true}; save(); }
      else S.shopMsg='Found you, but the map lookup did not answer. Prices are unchanged.';
    }
    else{
      S.place=p;
      // Only switch currency for a country the price model actually covers.
      if(p.code && p.code!==S.country) S.country=p.code;
      save();
    }
  }catch(e){ S.shopMsg=GEO_FAIL[e&&e.code]||'Could not get a location.'; }
  S.placeBusy=false; render();
}

async function findShops(route){
  S.shopMsg='Locating…'; render();
  if(!navigator.geolocation){ S.shopMsg='This browser has no location support.'; render(); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lon}=pos.coords;
    S.shopMsg='Reading the map…'; render();
    // name the place too, so the shop list says where it is looking
    placeOf(lat,lon).then(p=>{ if(p){ S.place=p; if(p.code&&p.code!==S.country) S.country=p.code; save(); render(); } });
    const q='[out:json][timeout:20];(nwr["shop"~"^(supermarket|convenience|grocery|greengrocer|butcher|seafood|deli|health_food|wholesale)$"](around:3000,'+lat+','+lon+');nwr["amenity"="marketplace"](around:3000,'+lat+','+lon+'););out center tags 80;';
    const mirrors=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
    for(const url of mirrors){
      try{
        const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q)});
        if(!r.ok) continue;
        const j=await r.json();
        if(!j.elements||!j.elements.length) continue;
        const now=new Date();
        S.stores=j.elements.map(e=>{
          const t=e.tags||{}, name=t.name||t.brand||t.operator; if(!name) return null;
          const la=e.lat!=null?e.lat:(e.center&&e.center.lat), lo=e.lon!=null?e.lon:(e.center&&e.center.lon);
          if(la==null||lo==null) return null;
          const kind=t.shop||(t.amenity==='marketplace'?'marketplace':'grocery');
          const st=PG.statusFrom(t.opening_hours,now);
          return {name,kind,lat:la,lon:lo,dist:PG.haversineKm(lat,lon,la,lo),open:st.openNow,closes:st.closesAt,
                  osmId:e.id,osmType:(e.type||'node').toUpperCase()};
        }).filter(Boolean).sort((a,b)=>a.dist-b.dist);
        S.shopMsg=null; render(); return;
      }catch(e){}
    }
    S.shopMsg='Could not reach OpenStreetMap from here. Everything else still works.';
    render();
  }, err=>{
    S.shopMsg = err.code===1 ? 'Location permission denied.' : 'No location fix.';
    render();
  }, {timeout:12000, maximumAge:300000});
}

function provenance(cov){
  const d=el('div');
  d.style.cssText='border-top:1px solid var(--line);margin-top:12px;padding-top:12px';
  const pct=Math.round(cov.realValueShare*100);
  d.innerHTML='<span class="lbl">Where these prices come from</span>'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px">'+
      '<span style="display:flex;align-items:center;gap:6px"><span class="src real-high"></span>real, well supported</span>'+

      '<span style="display:flex;align-items:center;gap:6px"><span class="src est"></span>estimated</span>'+
    '</div>'+
    '<p class="muted" style="font-size:12px;margin-top:10px;line-height:1.5">'+
      cov.real+' of '+cov.total+' items are priced from something somebody actually measured'+
      ' — that covers <strong style="color:var(--accent)">'+pct+
      '% of what you\'d actually spend</strong>. The rest are modelled from a reference price scaled by country and shop type.'+
    '</p>'+
    (cov.local>0
      ? '<p class="muted" style="font-size:12px;margin-top:8px;line-height:1.5"><strong style="color:var(--accent)">'+cov.local+
        ' of them were measured here in '+esc(PG.COUNTRIES[country().code].name)+'</strong>, at real markets, by '+
        PG.WFP_SOURCE+' (<a href="'+PG.WFP_URL+'" target="_blank" rel="noopener" style="color:var(--accent)">'+PG.WFP_LICENCE+
        '</a>). Not converted from somewhere else — recorded on the ground.</p>'
      : '<p class="muted" style="font-size:12px;margin-top:8px;line-height:1.5">None are measured in '+
        esc(PG.COUNTRIES[country().code].name)+' itself. The measured ones come from '+PG.SOURCE_NAME+
        ' (mostly Europe, snapshot '+PG.SNAPSHOT_DATE+') and are scaled to here, which is a good guess and not a local price.</p>')+
    (pct<40?'<p class="note warn" style="margin-top:10px">Most of this total is still modelled, not measured. Treat it as a guide to the shape of the cost, not a quote. Spices and store-cupboard items are the worst covered, which is also where pack sizes distort the first shop most.</p>':'');
  // "Modelled" on its own invites the reader to hear "invented". Saying which
  // published series carried the figure forward, and by how much, turns it into
  // something they can go and check.
  const est=PG.ageing(PG.REFERENCE_MONTH,country().code);
  const meas=PG.ageing(PG.SNAPSHOT_DATE.slice(0,7),country().code,new Date(),'measured');
  const box=el('div'); box.style.cssText='margin-top:11px;border-top:1px solid var(--line);padding-top:11px';
  box.innerHTML='<span class="lbl">How old these numbers are</span>'+
    '<p class="muted" style="font-size:12px;margin-top:7px;line-height:1.5">Modelled: '+esc(est.basis)+'</p>'+
    '<p class="muted" style="font-size:12px;margin-top:5px;line-height:1.5">Measured: '+esc(meas.basis)+'</p>'+
    (est.series?'<p class="muted" style="font-size:11.5px;margin-top:7px">Series: <a href="'+esc(est.series.url)+'" target="_blank" rel="noopener" style="color:var(--accent)">'+esc(est.series.source)+'</a></p>':'');
  d.appendChild(box);
  return d;
}

/* ==================================================== contribute a price ===
   The app reads Open Prices, which is ODbL and asks you to share back. It is
   also the only route to the shops no commercial feed will ever cover. */
let opSession=null, opMsg=null, opBusy=false;

function contributeSheet(it){
  const v=el('div','card stack-sm'); v.style.marginTop='10px';
  v.appendChild(el('div','row','<h3>Report the price of '+esc(it.name.split(',')[0])+'</h3>'));
  v.appendChild(el('p','muted','Goes to Open Prices, the open dataset this app reads from. Everyone gets it, including you — it is what makes the next basket less of a guess.')).style.cssText='font-size:12.5px';

  if(!opSession){
    v.appendChild(el('p','note tip','Sign in with an Open Food Facts account. Your password goes straight from this device to Open Food Facts and is never stored or sent anywhere else — there is no server in this app to send it to.')).style.marginTop='4px';
    const u=el('input'); u.placeholder='Open Food Facts username'; u.autocapitalize='none'; u.autocomplete='username';
    const pw=el('input'); pw.type='password'; pw.placeholder='Password'; pw.autocomplete='current-password';
    const go=el('button','btn primary',opBusy?'Signing in…':'Sign in to Open Food Facts');
    go.disabled=opBusy;
    go.onclick=async()=>{
      opBusy=true;opMsg=null;render();
      try{ opSession=await PG.signIn(u.value.trim(),pw.value); opMsg=null; }
      catch(e){ opMsg=e.message||String(e); }
      opBusy=false;render();
    };
    v.appendChild(u); v.appendChild(pw); v.appendChild(go);
    const mk=el('a',null,'Create a free account'); mk.href='https://world.openfoodfacts.org/cgi/user.pl';
    mk.target='_blank'; mk.rel='noopener'; mk.style.cssText='font-size:12px;color:var(--accent);display:block;margin-top:4px';
    v.appendChild(mk);
    if(opMsg) v.appendChild(el('p','note warn',esc(opMsg)));
    return v;
  }

  const shops=(S.stores||[]).filter(x=>x.osmId).slice(0,25);
  if(!shops.length){
    v.appendChild(el('p','note warn','Open Prices records which shop a price came from, so find the shops near you first — the Where tab has the button. A price with no shop attached is not much use to anyone.'));
    return v;
  }

  const sel=el('select');
  shops.forEach((x,i)=>{const o=document.createElement('option');o.value=String(i);
    o.textContent=x.name+' · '+x.dist.toFixed(1)+' km';sel.appendChild(o)});
  const price=el('input'); price.type='number'; price.step='0.01'; price.inputMode='decimal'; price.placeholder='Price you saw, in '+country().symbol;
  const per=el('div','seg');
  let perMode='KILOGRAM';
  [['per kg','KILOGRAM'],['per pack','UNIT']].forEach(([l,m],i)=>{
    const b=el('button',i===0?'on':''); b.textContent=l;
    b.onclick=()=>{perMode=m;[...per.children].forEach((c,j)=>c.className=(j===i?'on':''))};
    per.appendChild(b);
  });
  const photo=el('input'); photo.type='file'; photo.accept='image/*'; photo.capture='environment';
  v.appendChild(el('span','lbl','Which shop')); v.appendChild(sel);
  v.appendChild(price); v.appendChild(per);
  v.appendChild(el('p','muted','Open Prices needs a photo of the shelf label or receipt. That requirement is the reason the data is worth reading — someone else can check it later.')).style.cssText='font-size:12px;margin-top:6px';
  v.appendChild(photo);

  const send=el('button','btn primary',opBusy?'Sending…':'Send to Open Prices');
  send.disabled=opBusy;
  send.onclick=async()=>{
    const shop=shops[parseInt(sel.value,10)];
    const val=parseFloat(price.value);
    if(!(val>0)){opMsg='Enter the price you saw.';render();return}
    if(!photo.files||!photo.files[0]){opMsg='A photo of the label or receipt is required.';render();return}
    if(!shop||!shop.osmId){opMsg='That shop has no OpenStreetMap id, so Open Prices cannot place it.';render();return}
    opBusy=true;opMsg=null;render();
    try{
      const proof=await PG.uploadProof(opSession,photo.files[0],'PRICE_TAG');
      const d=new Date();
      await PG.submitPrice(opSession,{
        categoryTag:PG.OFF_CATEGORY[it.ref], price:val, currency:country().currency,
        pricePer:perMode, date:d.toISOString().slice(0,10),
        osmId:shop.osmId, osmType:shop.osmType||'NODE',
        proofId:proof, comment:'via Pantry Globe',
      });
      opMsg='✓ Sent. Thank you — that one is now in the open dataset for everybody.';
      S.contribFor=null;
    }catch(e){ opMsg=e.message||String(e); }
    opBusy=false;render();
  };
  v.appendChild(send);
  if(opMsg) v.appendChild(el('p','note '+(opMsg[0]==='✓'?'good':'warn'),esc(opMsg)));
  return v;
}
