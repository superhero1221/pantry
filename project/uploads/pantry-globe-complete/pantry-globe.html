<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060d0a">
<title>Pantry — what should I cook?</title>
<meta name="description" content="Name a dish and a place. Real shops, live opening hours, honest basket costs, full macros and micros, and how to cook it.">
<!-- Installable when served over http(s); all four lines 404 harmlessly when the
     file is opened directly from disk, which must keep working. -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ================= palette =================
   Light by default, and that is a researched decision rather than a taste one.
   HelloFresh ships #FAF8F3, Green Chef #FBF9F0, Mindful Chef #FCF8ED, Cherrypick
   #F5F2F2 — four warm off-whites, and not one of the five biggest meal apps puts
   a dark background behind food. What IS well evidenced is contrast between the
   food and its ground, and warm light: dishes photographed under 3000K read as
   more appealing than under daylight or cool light. So the surround is warm and
   pale and the food carries the colour.

   Worth being precise about the limit of the evidence, because the folklore here
   is thick: a 448-person study found background colour did NOT significantly
   change appetite. Warm light and food-to-ground contrast are supported. "Green
   backgrounds suppress appetite" is not a thing. The dark theme is still one tap
   away and nothing about it is wrong — it just is not what the category does. */
:root{
  --bg:#faf6ee; --surface:#ffffff; --surface2:#f4eee2; --line:#e8dfd0; --line2:#d6c9b4;
  --text:#141815; --muted:#5c6a61; --dim:#7d8b83;
  --accent:#0d8552; --accent-soft:rgba(13,133,82,.10); --accent-line:rgba(13,133,82,.34);
  --warn:#a2650d; --bad:#bd3b2c;
  --plate:#e4d9c4; --plate2:#efe7d6; --plate-rim:rgba(90,70,40,.16);
  --shadow:0 1px 2px rgba(60,45,25,.05),0 12px 28px -18px rgba(60,45,25,.35);
  --glow:rgba(255,214,140,.30);
  --orb:radial-gradient(120% 110% at 32% 22%,rgba(255,250,238,1),rgba(243,235,220,1) 68%);
  --glass:linear-gradient(160deg,#ffffff,#f7f1e6);
  --r:20px;
}
[data-theme="dark"]{
  --bg:#060d0a; --surface:#0c1712; --surface2:#112019; --line:#1b3227; --line2:#264537;
  --text:#f0fbf5; --muted:#9bb5a6; --dim:#75907f;
  --accent:#35d68f; --accent-soft:rgba(53,214,143,.12); --accent-line:rgba(53,214,143,.42);
  --warn:#f5c451; --bad:#ff7a7a;
  --plate:#16241d; --plate2:#1d3128; --plate-rim:rgba(0,0,0,.5);
  --shadow:0 18px 40px -22px rgba(0,0,0,.95);
  --glow:rgba(53,214,143,.09);
  --orb:radial-gradient(120% 110% at 32% 22%,rgba(120,235,185,.20),rgba(10,24,18,.94) 62%);
  --glass:linear-gradient(160deg,rgba(28,52,42,.72),rgba(9,20,15,.82));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:16.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% -10%, var(--glow), transparent 60%)}
main{position:relative;z-index:1;touch-action:pan-y pinch-zoom;max-width:620px;margin:0 auto;padding:24px 18px calc(64px + env(safe-area-inset-bottom))}
h1{font-size:34px;line-height:1.06;margin:0;letter-spacing:-.038em;font-weight:800}
h2{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.028em;font-weight:760}
h3{font-size:18px;margin:0;font-weight:720;letter-spacing:-.018em}
p{margin:0}
.stack>*+*{margin-top:14px}
.stack-sm>*+*{margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card2{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.085em;color:var(--muted);font-weight:750}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:10px}
button,select,input{font:inherit;color:inherit;border:0;background:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border-radius:16px;padding:17px 18px;font-size:17px;font-weight:730;letter-spacing:-.015em;
  border:1px solid var(--line2);background:var(--surface2);cursor:pointer;transition:.16s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:11px 15px;font-size:15px;font-weight:700;border-radius:13px;width:auto}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px;justify-content:flex-start;width:auto}
/* --- onboarding option tiles --- */
.opt{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:.16s ease}
.opt:hover{border-color:var(--line2)}
.opt.on{background:var(--accent-soft);border-color:var(--accent-line)}
.opt .t{font-size:17.5px;font-weight:740;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt.on .t{color:var(--accent)}
.opt .s{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 19px;position:relative;transition:.16s}
.opt.on .tick{border-color:var(--accent);background:var(--accent)}
.opt.on .tick::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* --- progress --- */
.prog{display:flex;gap:5px;margin-bottom:26px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.3s}
.prog i.done{background:var(--accent)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:10px 15px;font-size:14.5px;font-weight:660;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.16s}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
select,input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--accent-line)}
.bar{height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .3s}
.note{border-radius:14px;padding:14px 15px;font-size:14px;line-height:1.5;font-weight:520}
.note.good{background:var(--accent-soft);color:var(--accent)}
.note.warn{background:rgba(245,196,81,.1);color:var(--warn)}
.note.tip{background:rgba(53,214,143,.08);color:var(--accent)}
.note.delta{background:rgba(245,196,81,.11);color:var(--warn)}
.item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;cursor:pointer;width:100%;text-align:left;transition:.13s}
.item:hover{background:rgba(255,255,255,.035)}
.item.own .nm{text-decoration:line-through;opacity:.4}
.big{font-size:38px;font-weight:800;letter-spacing:-.042em;line-height:1;margin-top:5px}
.step{display:flex;gap:13px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.n{flex:0 0 25px;height:25px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fade{animation:f .32s ease}
@keyframes f{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.src{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-right:1px}
.src.real-high{background:var(--accent)}
.src.real-med{background:var(--accent);opacity:.55}
.src.real-low{border:1.5px solid var(--accent);background:transparent}
.src.est{border:1.5px solid var(--line2);background:transparent}
.shop{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px;background:var(--accent)}
.dot.open{background:var(--accent)}
.dot.shut{background:var(--bad)}
.dot.unk{background:var(--line2)}
.cookstep{padding:26px 0}
.cooknum{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cooktext{font-size:25px;line-height:1.38;margin-top:14px;letter-spacing:-.02em;font-weight:560}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent);display:flex;gap:10px;max-width:620px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;max-width:620px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;
  border-radius:13px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:730;transition:.18s var(--ease)}
.nav button b{font-size:19px;line-height:1;font-weight:400}
.nav button.on{color:var(--accent)}
.nav button.on b{transform:translateY(-1px)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))!important}
/* ======================= exploded view =======================
   The McDonald's-advert effect: the dish holds together, then comes apart into
   its real ingredients, each one a photograph floating above the plate. Built
   in CSS 3D rather than WebGL because the whole app is one HTML file that has
   to work offline, and a real perspective transform on twelve images does the
   job that a 3D engine would do at a hundred times the weight. */
.x3d{perspective:1100px;perspective-origin:50% 46%;width:78%;margin:0 auto;aspect-ratio:1/1;
  position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.x3d .stack{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .8s var(--ease)}
.x3d .lay{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  transition:transform .85s var(--spring),opacity .4s var(--ease);will-change:transform}
.x3d .lay img{display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(50,35,15,.34))}
.x3d .base{border-radius:50%;overflow:hidden;box-shadow:0 26px 46px -22px rgba(40,28,12,.6)}
.x3d .base img{object-fit:cover;border-radius:50%}
.x3d .tag{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;max-width:44vw;
  background:var(--surface);border:1px solid var(--accent-line);border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:700;box-shadow:var(--shadow);
  opacity:0;transition:opacity .35s var(--ease) .15s;pointer-events:none}
.x3d .tag s{text-decoration:none;color:var(--muted);font-weight:600;margin-left:6px;font-size:11px}
.x3d.open .tag{opacity:1}
.x3d .hint{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12px;color:var(--dim)}
.hero{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;
  background:var(--surface2);box-shadow:var(--shadow)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cr{position:absolute;left:0;right:0;bottom:0;padding:22px 13px 9px;font-size:10px;
  color:rgba(255,255,255,.9);background:linear-gradient(transparent,rgba(0,0,0,.62))}
.hero .cr a{color:#fff}
.heroswap{display:flex;gap:7px;margin-top:9px}
.cam{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#000;position:relative}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;inset:22% 12%;border:2.5px solid var(--accent);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
.prod{display:flex;gap:14px;align-items:flex-start}
.prod img{width:88px;height:88px;object-fit:contain;border-radius:12px;background:#fff;flex:0 0 88px;
  border:1px solid var(--line)}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.ing{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:11px 9px 12px;text-align:center;cursor:pointer;transition:.18s var(--ease);box-shadow:var(--shadow)}
.ing:hover{border-color:var(--accent-line)}
.ing.on{border-color:var(--accent);background:var(--accent-soft)}
.ing .pic{width:100%;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ing .pic svg,.ing .pic img{width:100%;height:100%;object-fit:contain}
.ing .nm{font-size:12.5px;font-weight:680;line-height:1.2;margin-top:5px;letter-spacing:-.01em}
.ing .qt{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ing .sw{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  background:var(--accent);color:#fff;border-radius:999px;padding:2px 6px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* ============================ depth ============================
   The whole app sits in one perspective. Everything that lifts does so with the
   same spring and the same shadow growth, because inconsistent depth reads as
   cheap far faster than no depth at all. */
:root{ --spring:cubic-bezier(.32,1.5,.5,1); --ease:cubic-bezier(.22,1,.36,1); }
.scene{perspective:900px;perspective-origin:50% 42%}
.lift{transition:transform .5s var(--spring),box-shadow .5s var(--ease)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* meal bubble ------------------------------------------------------------ */
.bub{position:relative;width:100%;border:0;padding:0;background:none;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s var(--spring)}
.bub:active{transform:scale(.965)}
.bub .orb{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:var(--orb);
  box-shadow:var(--shadow),0 0 0 1px var(--line) inset;
  transition:box-shadow .5s var(--ease),transform .55s var(--spring)}
.bub:hover .orb{box-shadow:var(--shadow),0 0 0 1px var(--accent-line) inset}
/* the specular sweep is what sells glass; without it an orb reads as a flat circle */
.bub .orb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(58% 40% at 30% 14%,rgba(255,252,244,.55),transparent 62%)}
.bub .cap{margin-top:9px;text-align:center}
.bub .cap b{display:block;font-size:15px;font-weight:730;letter-spacing:-.015em;line-height:1.22}
.bub .cap s{display:block;text-decoration:none;font-size:12px;color:var(--muted);margin-top:3px;font-weight:560}
/* plate ------------------------------------------------------------------ */
.plate{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y pinch-zoom}
.plate .pl{transition:transform .62s var(--spring),opacity .38s var(--ease),filter .38s var(--ease);
  transform-box:fill-box;transform-origin:50% 50%}
.plate .pl.dim{opacity:.38;filter:saturate(.45) brightness(.8)}
.plate .pl.pick{cursor:pointer}
/* callout ---------------------------------------------------------------- */
.call{position:absolute;z-index:3;pointer-events:none;animation:pop .42s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.call .bx{max-width:min(62vw,240px);white-space:normal;background:var(--surface);border:1px solid var(--accent-line);border-radius:13px;
  padding:8px 11px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.call .bx u{display:block;text-decoration:none;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.call .bx b{font-size:15px;font-weight:680;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.call .bx i{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:5px}
.tapme{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font-size:11.5px;color:var(--dim);
  pointer-events:none;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.seg button{flex:1;border-radius:11px;padding:11px 6px;font-size:14px;font-weight:720;color:var(--muted);cursor:pointer;transition:.2s var(--ease)}
.seg button.on{background:var(--accent);color:#fff}
/* ===================== living in a small frame =====================
   The app is often first seen inside an embedded preview panel a few hundred
   pixels tall. Two things go wrong there. A swipe that reaches the end of this
   document chains into the host page, so the gesture is split and the app
   appears to move a few millimetres; overscroll-behavior stops the chaining and
   keeps the whole swipe here. And a layout tuned for a full phone screen leaves
   very little content visible at a time, which makes any amount of scrolling
   feel unproductive — so below 720 px of height everything tightens up. */
html{overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain}
@media (max-height:720px){
  main{padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
  .card{padding:14px;border-radius:16px}
  .stack>*+*{margin-top:10px}
  h1{font-size:22px} h2{font-size:18px}
  .big{font-size:23px}
  .btn{padding:12px 15px;font-size:14.5px}
  .bub .orb{max-width:118px;margin:0 auto}
  .bub .cap b{font-size:12px}
  .note{padding:10px 11px;font-size:12px}
  .prog{margin-bottom:16px}
  .opt{padding:12px 14px}
}
/* Scroll entrance. Cards settle in as they arrive rather than being there
   already — the app should feel like it is assembling itself under the thumb.
   Applied once and then forgotten, so scrolling back up does not re-run it. */
.rise{opacity:0;transform:translateY(18px) scale(.985);
  transition:opacity .5s var(--ease),transform .62s var(--spring)}
.rise.in{opacity:1;transform:none}
.swipehint{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11.5px;color:var(--dim);margin-top:10px}
.swipehint i{font-style:normal;animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(4px);opacity:.9}}
.daywrap{touch-action:pan-y}
@media (prefers-reduced-motion:reduce){
  .lift,.bub,.bub .orb,.plate .pl,.seg button,.rise{transition-duration:.01ms!important}
  .rise{opacity:1;transform:none}
  .call,.tapme{animation:none}
}
</style>
</head>
<body>

rrected ${h.factor<1?"down":"up"} ${Math.abs(Math.round((h.factor-1)*100))}% to match ${h.on} things measured here`:"reference price scaled by country and shop type"}}var Pe=new Map;function te(e){let t=Pe.get(e.code);if(t)return t;let a=L[e.code],r={factor:1,applied:!1,on:0};if(a){let o=[];for(let[n,i]of Object.entries(a)){let s=v[n];if(!s||!s.packSize)continue;let h=s.packPriceGBP*e.index*e.fx/s.packSize*1e3,m=i.usdPerKg*(e.fx/xe);if(h<=0||m<=0)continue;let l=m/h;l>.25&&l<4&&o.push(l)}if(o.length>=4){o.sort((s,h)=>s-h);let n=o.length>>1,i=o.length%2?o[n]:(o[n-1]+o[n])/2;r={factor:Math.min(2,Math.max(.5,i)),applied:!0,on:o.length}}}return Pe.set(e.code,r),r}function F(e){let t=s=>s.source==="real"||s.source==="local",a=e.length,r=e.filter(t).length,o=e.filter(s=>s.source==="local").length,n=e.reduce((s,h)=>s+h.packPrice,0),i=e.filter(t).reduce((s,h)=>s+h.packPrice,0);return{total:a,real:r,local:o,realValueShare:n>0?i/n:0}}var Ae=[{id:"butter_chicken",name:"Butter Chicken (Murgh Makhani)",localName:"\u092E\u0941\u0930\u094D\u0917\u093C \u092E\u0916\u0928\u0940",cuisine:"North Indian",country:"IN",blurb:"Yogurt-marinated thigh seared hard, then finished in a cashew-thickened tomato sauce enriched with butter and cream off the heat.",servings:2,activeMin:40,totalMin:85,difficulty:"medium",items:[{ref:"chicken_thigh",grams:400,note:"boneless and skinless, cut into 3 cm pieces"},{ref:"greek_yogurt",grams:80,note:"for the marinade"},{ref:"lemon",grams:15,note:"juice only"},{ref:"garlic",grams:20,note:"crushed; half to the marinade, half to the sauce"},{ref:"ginger",grams:20,note:"finely grated; half to the marinade, half to the sauce"},{ref:"kashmiri_chilli",grams:6,note:"mild, this is the colour not the heat"},{ref:"turmeric",grams:2},{ref:"cumin_ground",grams:4},{ref:"coriander_ground",grams:4},{ref:"garam_masala",grams:5,note:"half in the marinade, half stirred in at the very end"},{ref:"salt",grams:8},{ref:"vegetable_oil",grams:15,note:"for searing"},{ref:"butter",grams:50,note:"half for the onions, half diced and cold for finishing"},{ref:"onion",grams:120,note:"finely diced"},{ref:"tomato_puree",grams:30},{ref:"passata",grams:300},{ref:"cashews",grams:40,note:"soaked in just-boiled water for 20 min"},{ref:"double_cream",grams:60,note:"off the heat"},{ref:"sugar",grams:6,note:"balances the tomato acidity"},{ref:"fenugreek_leaves",grams:2,note:"kasuri methi, crushed between the palms"},{ref:"basmati_rice",grams:150,note:"dry weight, rinsed until the water runs clear"},{ref:"water",grams:480,note:"300 g for the rice, 180 g split between the sauce and the cashew paste"},{ref:"coriander_fresh",grams:8,note:"chopped, to finish",optional:!0},{ref:"flatbread",grams:120,note:"naan, warmed",optional:!0}],method:[{n:1,text:"Pat the chicken dry with kitchen paper. In a bowl mix the yogurt, half the garlic, half the ginger, the kashmiri chilli, turmeric, cumin, ground coriander, half the garam masala, half the salt and the lemon juice. Fold the chicken through until every piece is coated. Cover and refrigerate for at least 30 minutes, or up to 12 hours.",minutes:30,tip:"Dry the chicken first. Marinade slides straight off wet meat and you lose both the seasoning and the char."},{n:2,text:"Put the cashews in a mug, cover with just-boiled water and leave them to soften while you cook.",minutes:20},{n:3,text:"Heat the vegetable oil in a wide frying pan over high heat until it shimmers. Sear the marinated chicken in a single layer for about 3 minutes per side, in two batches, until there are dark charred patches. The chicken does not need to be cooked through yet. Set it aside on a plate with any juices.",minutes:12,tip:"Two batches, always. A crowded pan drops in temperature and the chicken boils grey in its own liquid instead of catching colour."},{n:4,text:"Turn the heat to medium. Add 25 g of the butter and the diced onion to the same pan and cook for 8 minutes, scraping the browned bits off the base, until the onion is soft and pale gold.",minutes:8},{n:5,text:"Add the remaining garlic and ginger and stir constantly for 60 seconds.",minutes:1,tip:"Stop the moment it smells sweet and fragrant rather than raw and dusty. Garlic burns in about 20 seconds past that point and turns the sauce bitter."},{n:6,text:"Add the tomato puree and fry it for 2 minutes, stirring, until the colour shifts from bright red to a darker brick red and it starts to stick.",minutes:2},{n:7,text:"Pour in the passata and 100 g of the water, add the sugar and the remaining salt, and simmer uncovered over medium-low heat for 12 minutes.",minutes:12,tip:"You are waiting for beads of orange oil to pool at the edge of the pan. That is the signal the tomato is cooked out. If you stop before it, the sauce tastes sharp and raw no matter how much cream goes in."},{n:8,text:"While that simmers, cook the rice. Put the rinsed basmati and 300 g water in a small pan with a pinch of salt, bring to a boil uncovered, then clamp on a lid, drop to the lowest heat for 10 minutes, and leave it off the heat for a further 10 minutes.",minutes:20,tip:"Do not lift the lid to check. Every peek releases the steam that is actually cooking the top layer of grains."},{n:9,text:"Drain the cashews and blend them with 80 g fresh water to a completely smooth cream. Blend the tomato sauce smooth too, with a stick blender in the pan or in a jug blender, then return it to the pan.",minutes:4},{n:10,text:"Stir the cashew cream into the sauce and return the seared chicken with all its resting juices. Simmer gently for 8 minutes until the chicken reaches 74 C at the centre of the thickest piece.",minutes:8},{n:11,text:"Take the pan completely off the heat and wait 2 minutes. Now stir in the double cream, the remaining 25 g of cold diced butter a piece at a time, the remaining garam masala and the fenugreek leaves crushed between your palms.",minutes:3,tip:"Off the heat is not optional. Cream and butter added to a bubbling pan will break into grainy curds and an oil slick within seconds."},{n:12,text:"Let it sit for 5 minutes, then taste. It should be faintly sweet, clearly sour and salty enough to taste the spices; adjust with a pinch of salt or sugar. Fluff the rice with a fork, scatter the coriander over the curry and serve with warm naan.",minutes:5}],failures:[{symptom:"Sauce tastes sharp and raw, like warm tinned tomato",cause:"The tomato was not cooked out at step 7; keep simmering uncovered until oil beads at the edge, then correct with 2 g more sugar off the heat."},{symptom:"Sauce split into grainy curds with an oil slick",cause:"Cream went in over direct heat; pull the pan off, let it cool 2 minutes, then whisk in the cream and cold butter a piece at a time."},{symptom:"Chicken is dry and stringy",cause:"It was seared until cooked through and then simmered as well; sear only for colour and let it finish to 74 C in the sauce at step 10."},{symptom:"Colour is dull brown instead of orange",cause:"Hot chilli powder was used in place of kashmiri chilli, or the tomato puree scorched at step 6; kashmiri chilli is a colouring spice and needs to fry, not burn."},{symptom:"Sauce is thin and slides off the rice",cause:"The passata was not reduced enough or the cashews were skipped; simmer 5 minutes longer before the cream, or blend in 10 g more soaked cashews."}],variants:[{id:"bc_breast_lean",label:"Leaner, with breast and yogurt",swaps:[{from:"chicken_thigh",to:"chicken_breast",grams:380},{from:"double_cream",to:"greek_yogurt",grams:80}],methodDeltas:[{step:3,change:"Breast has no fat to protect it: sear 90 seconds per side for colour only, not 3 minutes."},{step:10,change:"Cut the simmer from 8 minutes to 4 minutes and pull the pan the moment the centre hits 74 C. Breast goes chalky within a minute of that."},{step:11,change:"Yogurt curdles far more readily than cream. Let the pan stand off the heat for a full 4 minutes, slacken the yogurt with 2 tablespoons of the hot sauce first, then stir the loosened yogurt back in."}],tags:["halal"],note:"Roughly a third less fat and a little more protein per portion; the sauce is tangier and thinner."},{id:"bc_paneer",label:"Paneer makhani (vegetarian)",swaps:[{from:"chicken_thigh",to:"paneer",grams:300}],methodDeltas:[{step:1,change:"Do not marinate paneer in yogurt for hours; the acid makes it rubbery. Toss the cubes in the spices and yogurt for 15 minutes only."},{step:3,change:"Fry the paneer over medium-high heat for 2 minutes per side until just golden, then drop the cubes into a bowl of warm salted water while the sauce cooks. This keeps them soft instead of squeaky."},{step:10,change:"Add the drained paneer for the last 3 minutes only, just to heat through. There is nothing to cook through, and a long simmer tightens the curd."}],tags:["vegetarian"]},{id:"bc_vegan_tofu",label:"Vegan, with tofu and coconut cream",swaps:[{from:"chicken_thigh",to:"tofu_firm",grams:350},{from:"greek_yogurt",to:"soya_yogurt",grams:80},{from:"butter",to:"vegetable_oil",grams:35},{from:"double_cream",to:"coconut_cream",grams:70}],methodDeltas:[{step:1,change:"Press the tofu between two plates under a heavy tin for 20 minutes before it goes anywhere near the marinade, otherwise it releases water into the sauce."},{step:3,change:"Tofu will not char like chicken. Fry it for 4 minutes per side over medium-high heat until the edges are firm and golden, and turn it with a fish slice rather than tossing the pan."},{step:10,change:"Nothing needs to reach a safe temperature, so simmer the tofu for just 4 minutes."},{step:11,change:"Coconut cream tolerates a little more heat than dairy but it will taste flat; add 5 g extra lemon juice with it to replace the sourness the yogurt and cream were providing."}],tags:["vegan","vegetarian","dairy_free"]},{id:"bc_prawn",label:"Prawn makhani",swaps:[{from:"chicken_thigh",to:"prawns_raw",grams:300}],methodDeltas:[{step:1,change:"Marinate the prawns for 15 minutes maximum. The lemon juice will start to cure them and turn the texture mealy if you leave them longer."},{step:3,change:"Skip the sear entirely; raw prawns go straight into the finished sauce."},{step:10,change:"Add the prawns to the simmering sauce and cook for 3 minutes only, until they curl into a loose C and turn opaque. A tight O means they are overcooked."}],tags:["halal"]}],restaurantGBP:11.95,tags:["halal"]},{id:"chicken_biryani",name:"Chicken Biryani",localName:"\u0628\u0631\u06CC\u0627\u0646\u06CC",cuisine:"South Asian",country:"IN",blurb:"Marinated chicken and parboiled basmati layered in one pot with fried onions and saffron milk, then steamed sealed under dum until the grains finish in the trapped steam.",servings:2,activeMin:55,totalMin:130,difficulty:"hard",items:[{ref:"chicken_thigh",grams:450,note:"boneless, cut into large 5 cm pieces"},{ref:"greek_yogurt",grams:200,note:"120 g for the marinade, 80 g for the raita"},{ref:"garlic",grams:20,note:"crushed to a paste"},{ref:"ginger",grams:20,note:"grated to a paste"},{ref:"green_chilli",grams:12,note:"slit lengthways"},{ref:"turmeric",grams:2},{ref:"kashmiri_chilli",grams:5},{ref:"garam_masala",grams:6},{ref:"cumin_ground",grams:5,note:"4 g in the marinade, a pinch saved for the raita"},{ref:"coriander_ground",grams:4},{ref:"salt",grams:30,absorption:.23,note:"6 g in the marinade, 24 g in the 2 L parboil water \u2014 it must taste properly salty, and nearly all of it is poured away"},{ref:"basmati_rice",grams:250,note:"aged basmati, soaked 30 min in cold water"},{ref:"onion",grams:200,note:"halved and sliced as thinly as you can manage"},{ref:"vegetable_oil",grams:60,note:"for frying the onions"},{ref:"ghee",grams:30,note:"drizzled over the layers"},{ref:"cardamom_green",grams:3,note:"pods, lightly crushed"},{ref:"cloves_whole",grams:1},{ref:"cinnamon_ground",grams:2},{ref:"bay_leaf",grams:1},{ref:"star_anise",grams:1},{ref:"saffron",grams:.2,note:"crumbled"},{ref:"milk_semi",grams:40,note:"warmed, for steeping the saffron"},{ref:"mint_fresh",grams:12,note:"leaves picked"},{ref:"coriander_fresh",grams:12,note:"roughly chopped, stalks included"},{ref:"lemon",grams:20,note:"juice, over the top layer"},{ref:"water",grams:2e3,note:"for parboiling the rice"},{ref:"cucumber",grams:80,note:"coarsely grated and squeezed dry, for the raita"},{ref:"plain_flour",grams:60,note:"mixed with water into a dough to seal the lid",optional:!0}],method:[{n:1,text:"Mix 120 g of the yogurt with the garlic and ginger pastes, the green chilli, turmeric, kashmiri chilli, half the garam masala, the ground cumin, ground coriander and 6 g salt. Fold in the chicken along with half the mint and half the coriander. Cover and refrigerate for at least 45 minutes, ideally overnight.",minutes:45},{n:2,text:"Rinse the basmati in a bowl of cold water, swirling and pouring off the cloudy water, four or five times until it runs almost clear. Cover with fresh cold water and leave it to soak for 30 minutes, then drain.",minutes:30,tip:"Soaking is what gives you long separate grains. Unsoaked rice absorbs water unevenly in the pot and snaps into short broken pieces when you fold it."},{n:3,text:"Heat the vegetable oil in a frying pan over medium heat and fry the sliced onion, stirring often, for 15 to 18 minutes until deep golden brown. Lift it out with a slotted spoon onto kitchen paper, where it will crisp as it cools. This is your birista. Keep 2 tablespoons of the oil.",minutes:18,tip:"Take the onions out one shade lighter than you want them. They carry on darkening on the paper, and burnt onion makes the entire pot taste bitter in a way nothing can fix."},{n:4,text:"Warm the milk until it is hot but not boiling, crumble in the saffron and leave it to steep. It should turn a strong orange within 10 minutes.",minutes:10},{n:5,text:"In a heavy casserole with a tight lid, heat the reserved onion oil over medium heat. Add the cardamom, cloves, bay leaf and star anise and let them sizzle for 40 seconds, then tip in the marinated chicken with all its marinade. Cook uncovered for 15 minutes, stirring occasionally.",minutes:16,tip:"Wait for the yogurt to stop looking like a pale sauce and start looking like a thick paste with oil separating at the edges. Watery marinade at the bottom means a soggy biryani base."},{n:6,text:"Stir the cinnamon and half the birista through the chicken, level the surface and turn off the heat. This is your bottom layer.",minutes:2},{n:7,text:"Bring 2 litres of water to a hard rolling boil in a large pan with 8 g salt. Add the drained rice and boil, uncovered, for 4 to 5 minutes only. Drain it immediately in a colander.",minutes:6,tip:"This is where most biryani fails. Fish out a grain and press it: it should snap into three pieces with a chalky white core still visible. Fully cooked rice here becomes mush after the dum."},{n:8,text:"Tip the drained rice straight onto the chicken in an even layer without pressing it down. Scatter over the remaining birista, the remaining mint and coriander, the remaining garam masala, the lemon juice, the saffron milk in stripes, and finally the ghee.",minutes:5},{n:9,text:"Seal the pot. Either roll the flour and water dough into a rope and press it around the rim before clamping the lid on, or cover the pot tightly with foil and put the lid on top of that.",minutes:5,tip:"A lid that merely sits on the pot lets the steam escape and the top layer of rice stays hard and dry. It has to be airtight."},{n:10,text:"Put the sealed pot over high heat for 3 minutes to build steam, then set it on the lowest possible flame, or on an empty frying pan or heat diffuser, and leave it for 25 minutes. Do not open it.",minutes:28,tip:"The diffuser matters. Direct low heat on a thin base will still scorch the chicken layer, and burnt-bottom smell travels through the whole pot."},{n:11,text:"Take the pot off the heat and leave it sealed for a further 10 minutes to settle.",minutes:10},{n:12,text:"While it rests, make the raita: stir the remaining 80 g yogurt with the grated and squeezed cucumber, a pinch of salt and the extra pinch of ground cumin.",minutes:4},{n:13,text:"Break the seal. Push a flat spoon down the side of the pot to the base and lift a wedge of rice and chicken together onto each plate so the layers stay visible. The thigh pieces must reach 75 C at the thickest point before the rice goes on.",minutes:3,tip:"Never stir a biryani. Stirring smashes the grains and turns the whole thing into a uniform orange pilaf; lift and fold from the edge instead."}],failures:[{symptom:"Rice is mushy and the grains have broken up",cause:"The rice was boiled past 70 per cent at step 7, or it was stirred at the end; boil to a chalky core and lift rather than stir."},{symptom:"Top layer of rice is still hard and chalky",cause:"Steam escaped because the lid was not sealed, or the dum was too short; reseal with foil, add 2 tablespoons of hot water down the side and give it another 10 minutes."},{symptom:"Bottom layer is burnt and the pot smells scorched",cause:"Direct heat on a thin base; move the pot onto a heat diffuser or an empty frying pan for the whole dum stage."},{symptom:"Bland and one-note despite all the spices",cause:"The rice water was underseasoned; the parboiling water should taste properly salty, because that is the only chance the grains get to be seasoned."},{symptom:"Watery, stew-like base under the rice",cause:"The marinade was not reduced at step 5; cook the chicken until the yogurt is a thick paste with oil separating before any rice goes on top."}],variants:[{id:"biryani_gosht_lamb",label:"Lamb biryani (gosht)",swaps:[{from:"chicken_thigh",to:"lamb_diced",grams:450}],methodDeltas:[{step:1,change:"Lamb needs the acid: marinate for a minimum of 4 hours, overnight is better."},{step:5,change:"Fifteen minutes will leave lamb tough. Cook it covered with 150 g added water for 50 to 60 minutes until a piece gives easily to a fork, then uncover and boil the liquid away until the fat separates."},{step:10,change:"The meat is already tender, so the dum is only about the rice; keep it at 25 minutes and do not extend it."}],tags:["halal"]},{id:"biryani_breast_lean",label:"Leaner, with chicken breast",swaps:[{from:"chicken_thigh",to:"chicken_breast",grams:420}],methodDeltas:[{step:3,change:"Drop the frying oil from 60 g to 40 g and drain the birista harder on kitchen paper; with no thigh fat rendering into the pot, the onions are the main fat and you want them crisp rather than oily. Check 75 C at the thickest point."},{step:5,change:"Cut the initial cook from 15 minutes to 7. Breast that is fully cooked before the dum will be dry cotton by the time the rice is done."},{step:10,change:"The breast finishes during the steam, so start timing the 25 minutes from the moment the pot is properly steaming rather than from when it goes on the heat."}],tags:["halal"],note:"Fry the onions in less oil and drain them harder; the birista is the main fat source in this version."},{id:"biryani_paneer",label:"Paneer biryani (vegetarian)",swaps:[{from:"chicken_thigh",to:"paneer",grams:300}],methodDeltas:[{step:1,change:"Marinate the paneer cubes for 20 minutes only. Left overnight in yogurt they go firm and squeaky."},{step:5,change:"Fry the spices in the oil, add the marinade alone and cook it down for 6 minutes until thick, then fold the paneer in for the last minute so it never boils."},{step:10,change:"Reduce the dum to 18 minutes. There is no meat to tenderise and paneer tightens with prolonged heat."}],tags:["vegetarian"]},{id:"biryani_vegan_soya",label:"Vegan soya chunk biryani",swaps:[{from:"chicken_thigh",to:"soya_chunks",grams:120},{from:"greek_yogurt",to:"soya_yogurt",grams:200},{from:"ghee",to:"vegetable_oil",grams:30},{from:"milk_semi",to:"water",grams:40}],methodDeltas:[{step:1,change:"Soak the dry soya chunks in boiling salted water for 15 minutes first, then squeeze them out hard like a sponge before marinating. Unsqueezed chunks flood the pot."},{step:4,change:"Saffron infuses more weakly in water than in milk; steep it in hot water for a full 20 minutes and add a pinch of extra salt to the infusion."},{step:5,change:"Soya yogurt is thinner and splits less predictably; cook the marinade down for 10 minutes rather than 15 and stir more often to stop it catching."}],tags:["vegan","vegetarian","dairy_free"],note:"Serve the raita made with soya yogurt as well."}],restaurantGBP:12.95,tags:["halal"]},{id:"shakshuka",name:"Shakshuka",localName:"\u0634\u0643\u0634\u0648\u0643\u0629",cuisine:"North African and Levantine",country:"TN",blurb:"Eggs poached directly in a reduced pepper and tomato sauce spiced with cumin and smoked paprika, eaten straight from the pan with bread.",servings:2,activeMin:20,totalMin:40,difficulty:"easy",items:[{ref:"olive_oil",grams:30},{ref:"onion",grams:150,note:"halved and sliced"},{ref:"red_pepper",grams:160,note:"deseeded and cut into 1 cm strips"},{ref:"garlic",grams:16,note:"thinly sliced"},{ref:"cumin_ground",grams:4},{ref:"paprika_smoked",grams:4},{ref:"chilli_powder",grams:1,note:"or more to taste"},{ref:"tomato_puree",grams:20},{ref:"tomato_tinned",grams:400,note:"whole plum tomatoes, crushed by hand"},{ref:"sugar",grams:4},{ref:"salt",grams:5},{ref:"black_pepper",grams:1,note:"freshly ground"},{ref:"egg",grams:200,note:"4 medium eggs, cracked into separate cups first"},{ref:"feta",grams:60,note:"crumbled over at the end",optional:!0},{ref:"harissa",grams:15,note:"stirred into the sauce for heat",optional:!0},{ref:"parsley_fresh",grams:10,note:"chopped"},{ref:"coriander_fresh",grams:8,note:"chopped",optional:!0},{ref:"bread_sourdough",grams:160,note:"thick slices, toasted"}],method:[{n:1,text:"Crack each egg into its own small cup or ramekin and set them by the hob. Chop everything else before you start cooking.",minutes:5,tip:"Cracking eggs directly into a hot pan means shell fragments and a broken yolk with no way to fix either. The cups take thirty seconds and remove both risks."},{n:2,text:"Heat the olive oil in a 24 to 26 cm frying pan that has a lid, over medium heat. Add the onion and red pepper with a pinch of the salt and cook for 10 minutes, stirring now and then, until the pepper is limp and the onion is translucent and starting to colour at the edges.",minutes:10},{n:3,text:"Add the sliced garlic and cook for 1 minute more, keeping it moving.",minutes:1},{n:4,text:"Push the vegetables to one side, add the cumin, smoked paprika and chilli powder to the bare oil and stir them for 30 seconds before mixing them through.",minutes:1,tip:"Blooming the spices in oil rather than dropping them into wet tomato is the difference between a rounded sauce and a raw, dusty one. Thirty seconds is the whole window before paprika turns bitter."},{n:5,text:"Stir in the tomato puree and fry it for 90 seconds until it darkens.",minutes:2},{n:6,text:"Crush the tinned tomatoes into the pan with your hand, add the sugar, the remaining salt, the black pepper and the harissa if using. Bring to a simmer.",minutes:3},{n:7,text:"Simmer uncovered over medium-low heat for 12 to 15 minutes, stirring occasionally, until the sauce is thick enough that a spoon dragged across the base leaves a channel that holds for a second or two.",minutes:14,tip:"Reduce it further than feels right. The eggs release a surprising amount of water as they poach, and a loose sauce ends up as tomato soup with eggs floating in it."},{n:8,text:"Taste and correct: it should be sweet, sour and salty in roughly equal measure. Put the toast on now.",minutes:2},{n:9,text:"Use the back of a spoon to make four shallow wells in the sauce, spaced apart, each going almost to the base of the pan. Slide one egg into each well.",minutes:2},{n:10,text:"Season the yolks lightly, turn the heat to low, cover the pan and cook for 6 to 8 minutes.",minutes:8,tip:"Check at 6 minutes. The whites should be opaque all the way to the yolk with no clear jelly left, while the yolk still wobbles when you shake the pan. Past 9 minutes the yolks set solid and there is no going back."},{n:11,text:"Take the pan off the heat, crumble over the feta and scatter the parsley and coriander. Bring the whole pan to the table with the toast and let people spoon it out themselves.",minutes:2}],failures:[{symptom:"Watery sauce pooling around the eggs",cause:"The sauce was not reduced far enough before the eggs went in; lift the eggs out with a slotted spoon, boil the sauce hard for 3 minutes, then slide them back."},{symptom:"Yolks set hard before the whites cooked",cause:"The heat was too high, so the base cooked before the steam did; lower the flame and rely on the lid, which sets the tops of the whites from above."},{symptom:"Sauce tastes dusty and bitter",cause:"The paprika burned or was never bloomed; fry the ground spices in oil for 30 seconds only, off to one side of the pan."},{symptom:"Eggs slid together into one sheet",cause:"The wells were too shallow and too close; press each well right down to the pan base with the back of a spoon and keep them a spoon-width apart."}],variants:[{id:"shakshuka_vegan_tofu",label:"Vegan, with crumbled tofu",swaps:[{from:"egg",to:"tofu_firm",grams:250},{from:"feta",to:null}],methodDeltas:[{step:1,change:"No eggs to portion; instead press the tofu for 15 minutes and crumble it into rough 2 cm pieces so it holds together in the sauce."},{step:9,change:"There are no wells. Fold the crumbled tofu through the sauce, add 1 g turmeric for colour and 1 g extra salt, since tofu is bland where an egg yolk is rich."},{step:10,change:"Cover and cook for 5 minutes only, just to heat the tofu through. There is nothing to set, and longer simmering makes the crumbles disintegrate."}],tags:["vegan","vegetarian","dairy_free","halal"]},{id:"shakshuka_kofta",label:"With spiced beef mince",swaps:[{from:"feta",to:"beef_mince_5",grams:200}],methodDeltas:[{step:2,change:"Brown the mince in the dry pan over high heat for 5 minutes first, breaking it up, then lift it out and cook the onion and pepper in the fat it leaves behind, using only 15 g of the olive oil."},{step:6,change:"Return the browned mince with the tomatoes and add 2 g allspice or baharat with the other spices."},{step:7,change:"The mince adds fat and liquid; simmer for 18 minutes rather than 14 and skim any pooled fat before making the wells."}],tags:["halal"]},{id:"shakshuka_green",label:"Green shakshuka",swaps:[{from:"tomato_tinned",to:"spinach_fresh",grams:300},{from:"red_pepper",to:"courgette",grams:200},{from:"paprika_smoked",to:"lemon",grams:20}],methodDeltas:[{step:2,change:"Courgette holds far more water than pepper; cook it over medium-high heat for 8 minutes until it colours and stops steaming, or the finished pan will be soupy."},{step:6,change:"There is no tomato to build a sauce, so add 120 g water with the spinach and wilt it in two handfuls over 3 minutes."},{step:7,change:"Reduce for 5 minutes only, to a loose green base rather than a thick sauce, and finish with the lemon juice off the heat."},{step:9,change:"The base is thinner, so make the wells by pushing the greens aside right down to the metal, and add the eggs one at a time so the base does not flood back over them."}],tags:["vegetarian","halal","nut_free"]},{id:"shakshuka_chickpea",label:"Higher protein, with chickpeas",swaps:[{from:"bread_sourdough",to:"chickpeas_tinned",grams:240}],methodDeltas:[{step:6,change:"Add the drained chickpeas with the tomatoes so they have time to absorb the sauce and soften."},{step:7,change:"Chickpeas soak up liquid as they simmer; add 80 g water and extend the reduction to 18 minutes, checking that the base does not catch."},{step:11,change:"Without bread you need something to carry it, so crush a few chickpeas against the side of the pan to thicken the sauce into something spoonable."}],tags:["vegetarian","halal","gluten_free","nut_free"],note:"Roughly 12 g more protein per portion and no wheat, at the cost of the bread."}],restaurantGBP:10.5,tags:["vegetarian","halal","nut_free"]},{id:"pad_thai",name:"Pad Thai",localName:"\u0E1C\u0E31\u0E14\u0E44\u0E17\u0E22",cuisine:"Thai",country:"TH",blurb:"Soaked rice noodles tossed in a tamarind, fish sauce and palm sugar reduction with prawns, tofu and egg, finished with peanuts, beansprouts and lime.",servings:2,activeMin:25,totalMin:55,difficulty:"medium",items:[{ref:"rice_noodles",grams:160,note:"flat 5 mm, dry weight"},{ref:"tamarind_paste",grams:40,note:"the sour concentrate, not sweetened sauce"},{ref:"fish_sauce",grams:35},{ref:"brown_sugar",grams:40,note:"palm sugar if you have it"},{ref:"water",grams:30,note:"to loosen the sauce"},{ref:"prawns_raw",grams:200,note:"peeled and deveined, patted dry"},{ref:"tofu_firm",grams:100,note:"pressed and cut into 1 cm cubes"},{ref:"egg",grams:100,note:"2 eggs, beaten"},{ref:"garlic",grams:12,note:"finely chopped"},{ref:"vegetable_oil",grams:30},{ref:"spring_onion",grams:40,note:"cut into 4 cm lengths"},{ref:"beansprouts",grams:120,note:"half in the wok, half raw on top"},{ref:"peanuts",grams:30,note:"roasted, roughly crushed"},{ref:"lime",grams:50,note:"cut into wedges"},{ref:"chilli_powder",grams:2,note:"at the table",optional:!0},{ref:"coriander_fresh",grams:6,note:"to finish",optional:!0}],method:[{n:1,text:"Soak the dry rice noodles in warm tap water, not boiling, for 30 to 40 minutes until they are pliable and bend easily around your finger but still snap if you bite one. Drain them well.",minutes:40,tip:"Boiling water is the classic mistake here. It cooks the noodles through before they reach the wok and they collapse into paste the moment sauce hits them."},{n:2,text:"Make the sauce: warm the tamarind paste, fish sauce, brown sugar and water in a small pan over low heat, stirring, for 3 minutes until the sugar has fully dissolved. Taste it. It should be aggressively sour, salty and sweet, in that order, and far too strong to drink.",minutes:4,tip:"Correct the balance now, not in the wok. Once the noodles are in there is no time to taste and adjust, and the noodles will dilute whatever you made by about half."},{n:3,text:"Line everything up next to the hob in the order you will use it: garlic, tofu, prawns, drained noodles, sauce, beaten egg, beansprouts, spring onion, peanuts.",minutes:5,tip:"This is the step people skip and it is the one that decides the dish. Once the wok is hot the whole stir-fry takes under five minutes and there is no pause to go and chop something. If it is not on the counter before the pan goes on, it will not make it in."},{n:4,text:"Heat a wok or your widest frying pan over the highest heat until a drop of water skitters and evaporates instantly. Add the oil and swirl it round.",minutes:3},{n:5,text:"Add the tofu cubes and fry for 2 minutes without moving them, then toss and fry 1 minute more until the edges are golden. Push them up the side of the wok.",minutes:3},{n:6,text:"Add the garlic to the centre and stir for 15 seconds, then add the prawns in a single layer and cook for 1 minute per side until just opaque. Push them up the side with the tofu.",minutes:2,tip:"Pull the prawns as soon as they turn from grey to white with pink edges. They will get another minute of heat when everything comes back together at the end."},{n:7,text:"Drop the drained noodles into the centre of the wok and pour the sauce over them. Toss constantly with tongs for 2 to 3 minutes until the noodles have drunk the sauce and turned an even amber brown.",minutes:3,tip:"If the noodles seize up and stick in a clump, add water one tablespoon at a time and keep tossing. Adding more oil at this point only makes them greasy without unsticking them."},{n:8,text:"Push everything to one side, pour the beaten egg into the bare base, let it sit undisturbed for 20 seconds until the underside sets, then chop through it with your spatula and fold it into the noodles in large curds.",minutes:2},{n:9,text:"Add half the beansprouts and all the spring onion, and toss for 45 seconds only.",minutes:1,tip:"Beansprouts are there for the snap. Anything past a minute in the wok and they go limp and start weeping water into the noodles."},{n:10,text:"Fold the tofu and prawns back through, add half the crushed peanuts and take the wok off the heat.",minutes:1},{n:11,text:"Taste one noodle. If it is flat, add fish sauce; if it is cloying, squeeze in lime; if it is harsh, a pinch of sugar. Adjust in the pan.",minutes:1},{n:12,text:"Pile onto two warm plates, top with the remaining raw beansprouts, the rest of the peanuts and the coriander, and serve with lime wedges and chilli powder on the side.",minutes:2}],failures:[{symptom:"Noodles turned to a sticky paste",cause:"They were soaked in boiling water or soaked too long; use warm water and stop while they still have a firm bite, since they finish cooking in the sauce."},{symptom:"Everything clumped into one solid mass",cause:"The pan was not hot enough and the noodles stewed; get the pan properly smoking, cook in one batch of two portions maximum, and loosen with splashes of water rather than oil."},{symptom:"Pale and bland instead of amber and sharp",cause:"The sauce was underseasoned before it went in; it must taste too strong on its own, because the noodles dilute it heavily."},{symptom:"Prawns are rubbery",cause:"They were left in the wok for the whole stir-fry; cook them for 2 minutes, remove them to the side of the pan, and fold them back only at the very end."},{symptom:"Egg scrambled into tiny dry specks",cause:"It was poured over the noodles and stirred immediately; clear a space to the bare pan, let it set for 20 seconds, then break it up."}],variants:[{id:"pad_thai_gai",label:"Pad thai gai (chicken)",swaps:[{from:"prawns_raw",to:"chicken_breast",grams:250}],methodDeltas:[{step:3,change:"Slice the breast across the grain into 5 mm strips as part of your prep; thick chunks will not cook through in wok time."},{step:6,change:"Chicken needs longer than prawns: fry the strips for 3 to 4 minutes total, spread out and barely stirred so they catch colour, until no pink remains and the centre reaches 74 C."},{step:10,change:"The chicken is already cooked through, so fold it back in off the heat to stop it drying out."}],tags:["dairy_free","halal"]},{id:"pad_thai_jay",label:"Pad thai jay (vegan)",swaps:[{from:"prawns_raw",to:"tofu_firm",grams:250},{from:"fish_sauce",to:"soy_sauce",grams:35},{from:"egg",to:null}],methodDeltas:[{step:2,change:"Soy sauce is saltier and less funky than fish sauce; use 30 g rather than 35 g and add 5 g extra tamarind to put back the sourness you lose."},{step:5,change:"With all 350 g of tofu in one wok, fry it in two batches or it will steam instead of browning, and press it for a full 30 minutes first so it holds its shape."},{step:8,change:"No egg step. Skip straight from the noodles to the beansprouts, but toss the noodles for an extra 30 seconds first since the egg was part of what bound them."}],tags:["vegan","vegetarian","dairy_free"]},{id:"pad_thai_lean",label:"Leaner, higher protein, less sugar",swaps:[{from:"tofu_firm",to:"chicken_breast",grams:200},{from:"brown_sugar",to:"honey",grams:22}],methodDeltas:[{step:2,change:"Honey dissolves instantly but scorches easily; take the sauce off the heat before you stir it in rather than simmering it. With almost half the sugar the sauce will taste sharper, so pull back to 30 g fish sauce to keep it balanced."},{step:5,change:"Replace the tofu step with the sliced chicken breast: 3 to 4 minutes over high heat, spread flat, until no pink remains and the centre reaches 74 C. Then out to the side of the wok."},{step:7,change:"Cut the oil from 30 g to 18 g. Less oil and less sugar means less non-stick coating on the noodles, so expect to add 40 to 50 g water in splashes while tossing and keep the tongs moving constantly."}],tags:["dairy_free","halal"],note:"Around 45 g protein per portion instead of 30 g, and roughly 9 g less sugar."}],restaurantGBP:11.5,tags:["dairy_free"]},{id:"swedish_meatballs",name:"Swedish Meatballs with Cream Sauce",localName:"K\xF6ttbullar med gr\xE4dds\xE5s",cuisine:"Swedish",country:"SE",blurb:"Small allspice and nutmeg seasoned beef meatballs bound with milk-soaked breadcrumbs, served with a pan gravy, mashed potato and lingonberry jam.",servings:2,activeMin:45,totalMin:60,difficulty:"easy-medium",items:[{ref:"beef_mince_5",grams:400,note:"take it out of the fridge 10 min before mixing"},{ref:"breadcrumbs",grams:40,note:"fine dry crumbs"},{ref:"milk_semi",grams:200,note:"70 g to soak the breadcrumbs, 130 g warmed for the mash"},{ref:"onion",grams:100,note:"grated on the coarse side of a box grater"},{ref:"egg",grams:50,note:"1 egg, beaten"},{ref:"allspice_ground",grams:2},{ref:"nutmeg",grams:1,note:"freshly grated if possible"},{ref:"white_pepper",grams:1},{ref:"salt",grams:7,absorption:.62,note:"4 g in the meatballs, 3 g for the potato water"},{ref:"butter",grams:70,note:"30 g for frying, 15 g for the roux, 25 g for the mash"},{ref:"vegetable_oil",grams:15,note:"stops the butter burning"},{ref:"plain_flour",grams:25},{ref:"stock_cube_beef",grams:7,note:"crumbled \u2014 a 10 g cube is made for 500 ml, and this gravy is 350"},{ref:"water",grams:350,note:"hot, for the gravy"},{ref:"double_cream",grams:120},{ref:"dijon_mustard",grams:8},{ref:"soy_sauce",grams:3,note:"for colour and depth in the gravy \u2014 it is salty, so this is deliberately small"},{ref:"potato",grams:500,note:"floury, peeled and cut into even 4 cm chunks"},{ref:"lingonberry_jam",grams:40,note:"served alongside, not on top"},{ref:"cucumber",grams:60,note:"sliced thin and steeped in vinegar and sugar",optional:!0},{ref:"vinegar_white",grams:20,note:"for the quick pickled cucumber",optional:!0},{ref:"sugar",grams:10,note:"for the quick pickled cucumber",optional:!0},{ref:"parsley_fresh",grams:6,note:"chopped, to finish",optional:!0}],method:[{n:1,text:"If you are making the pickled cucumber, do it first: mix the vinegar, sugar and a pinch of salt until dissolved, add the sliced cucumber and leave it in the fridge.",minutes:5},{n:2,text:"Put the breadcrumbs in a large bowl with 70 g of the milk and leave them for 10 minutes until the crumbs have swollen into a wet paste with no dry pockets.",minutes:10,tip:"This soaked paste, a panade, is what keeps the meatballs soft. Dry breadcrumbs stirred straight into mince pull moisture out and give you dense little bullets."},{n:3,text:"Squeeze the grated onion in your fist over the sink to get rid of the juice, then add it to the bowl with the egg, allspice, nutmeg, white pepper and 6 g salt. Mix to a smooth paste.",minutes:4},{n:4,text:"Add the mince and mix with your hands for about 45 seconds, just until no streaks of plain meat remain. Stop there.",minutes:2,tip:"Overworking is the main failure. Keep going past a minute and the proteins tighten into something closer to a sausage than a meatball, springy and rubbery when cooked."},{n:5,text:"Wet your hands with cold water and roll the mixture into 20 balls about 30 mm across. Put them on a plate and chill them in the fridge for 15 minutes while you start the potatoes.",minutes:18,tip:"Chilling firms the fat so the balls hold their shape and do not slump into ovals in the pan."},{n:6,text:"Put the potato chunks into cold salted water, bring to a boil and simmer for 18 to 20 minutes until a knife slides in with no resistance at all.",minutes:20},{n:7,text:"Heat 30 g butter and the oil in a large frying pan over medium heat until the foam subsides. Fry the meatballs in two batches, turning them every minute or so with a spoon, for 8 to 10 minutes per batch until browned all over and 71 C at the centre. Lift them onto a warm plate.",minutes:20,tip:"Roll them around rather than flipping them once. You want an even shell of colour on a sphere, and the browning left in the pan is the entire flavour base for the gravy."},{n:8,text:"Drain the potatoes and let them steam dry in the colander for 2 minutes, then mash them with 25 g butter and the 130 g warmed milk. Season and keep warm.",minutes:6,tip:"Warm the milk first. Cold milk in hot potato gives you a gluey mash, and a masher beats a food processor every time, which turns potato into wallpaper paste."},{n:9,text:"Pour off all but about 2 tablespoons of fat from the meatball pan, keeping the browned residue. Add the remaining 15 g butter and the flour and stir over medium heat for 2 minutes until it smells like biscuits and turns light brown.",minutes:3,tip:"Cook the flour properly. Two minutes is the difference between a savoury gravy and one that tastes of raw paste no matter what you add later."},{n:10,text:"Crumble the stock cube into 350 g hot water and pour it into the pan a third at a time, whisking each addition to a smooth paste before the next goes in. Scrape the base as you whisk.",minutes:4,tip:"Adding all the liquid at once is what makes lumps. If it does go lumpy, push the gravy through a sieve rather than whisking harder."},{n:11,text:"Stir in the cream, mustard and soy sauce and simmer gently for 5 minutes until the gravy coats the back of a spoon.",minutes:5},{n:12,text:"Return the meatballs and any juices to the pan and turn them in the gravy over low heat for 3 minutes to warm through.",minutes:3,tip:"Keep it just below a simmer. A hard boil with cream and mustard in the pan will split the gravy into fat and grains."},{n:13,text:"Taste the gravy for salt, scatter with parsley and serve with the mash, a spoonful of lingonberry jam on the side of the plate and the pickled cucumber.",minutes:3}],failures:[{symptom:"Meatballs are dense and bouncy",cause:"The mince was overmixed or the breadcrumbs went in dry; mix for 45 seconds only and always soak the crumbs in milk first."},{symptom:"Meatballs fell apart in the pan",cause:"The mixture was too wet or was not chilled; squeeze the grated onion dry, chill the rolled balls 15 minutes, and do not move them for the first minute in the pan."},{symptom:"Gravy is lumpy",cause:"The stock went in all at once; add it in thirds, whisking each to a smooth paste, or press the finished gravy through a sieve."},{symptom:"Gravy split into grease and grains",cause:"It boiled hard after the cream went in; keep it at a bare simmer and take the pan off the heat before whisking in a splash of cold stock to bring it back."},{symptom:"Mash is gluey",cause:"Cold milk or a food processor; steam the potatoes dry, use warmed milk, and mash by hand."}],variants:[{id:"kottbullar_chicken",label:"Chicken thigh meatballs",swaps:[{from:"beef_mince_5",to:"chicken_thigh",grams:400},{from:"stock_cube_beef",to:"stock_cube_chicken",grams:10}],methodDeltas:[{step:4,change:"Pulse the diced thigh in a food processor to a coarse mince in short bursts, then chill it for 20 minutes before mixing. Warm chicken mince smears into a paste."},{step:5,change:"The mixture is much stickier than beef; keep rewetting your hands and expect the balls to be slightly softer."},{step:7,change:"Chicken must reach 74 C rather than 71 C, but it browns faster, so drop the heat to medium-low and give it 10 to 12 minutes per batch."}],tags:["halal"]},{id:"kottbullar_lean",label:"Lighter gravy, with peas",swaps:[{from:"double_cream",to:"single_cream",grams:120},{from:"cucumber",to:"peas_frozen",grams:150}],methodDeltas:[{step:7,change:"Drop the total butter from 70 g to 45 g: fry the meatballs in 15 g butter plus the oil, keep 15 g back for the roux and 15 g for the mash."},{step:8,change:"With only 15 g butter left for the mash, add 30 g more of the warmed milk so it stays loose enough to spoon."},{step:11,change:"Single cream is thinner and much more likely to split; add it off the heat at the end rather than simmering it for 5 minutes, and thicken instead with an extra 5 g flour at step 9."},{step:13,change:"Boil the peas for 3 minutes in the potato water just before you drain it, and serve them alongside in place of the pickled cucumber."}],tags:["halal"],note:"Around 12 g less fat per portion, with fibre from the peas."},{id:"kottbullar_gf",label:"Gluten free",swaps:[{from:"breadcrumbs",to:"cornflour",grams:20},{from:"plain_flour",to:"cornflour",grams:15},{from:"soy_sauce",to:null}],methodDeltas:[{step:2,change:"Cornflour cannot be soaked into a panade. Instead whisk the 20 g cornflour into the 70 g milk cold and heat it in a small pan for 1 minute until it thickens into a paste, then cool it before mixing with the meat."},{step:9,change:"Do not make a roux with cornflour, it will go stringy. Melt the butter, add the stock, and thicken at the end by slurrying the 15 g cornflour with 30 g cold water and whisking it into the simmering gravy."},{step:11,change:"Without soy sauce the gravy is pale; add 3 g extra dijon and a pinch of salt, and let the meatball browning do the colour work by scraping the pan base thoroughly."}],tags:["gluten_free","halal"]},{id:"kottbullar_vegan",label:"Vegan, with soya chunks",swaps:[{from:"beef_mince_5",to:"soya_chunks",grams:130},{from:"egg",to:null},{from:"milk_semi",to:"water",grams:200},{from:"butter",to:"vegetable_oil",grams:55},{from:"double_cream",to:"coconut_cream",grams:120},{from:"stock_cube_beef",to:"stock_cube_veg",grams:10}],methodDeltas:[{step:2,change:"Rehydrate the soya chunks in boiling stock for 15 minutes, squeeze them dry hard, then blitz them coarsely. Soak the breadcrumbs in water rather than milk."},{step:4,change:"With no egg and no meat protein there is nothing binding the mix; add 15 g cornflour and knead for a full 2 minutes, which is the opposite of the beef instruction, until it holds together when squeezed."},{step:7,change:"These will not brown from rendered fat. Fry them in a generous film of oil over medium-high heat for 6 minutes, turning carefully with two spoons, and handle them less because they are more fragile."},{step:11,change:"Coconut cream carries its own flavour; add 5 g extra dijon and 10 g lemon juice to cut it, and check the salt twice since the vegetable stock is milder than beef."}],tags:["vegan","vegetarian","dairy_free"]}],restaurantGBP:13,tags:["halal"]},{id:"machboos_dajaj",name:"Machboos Dajaj",localName:"\u0645\u0643\u0628\u0648\u0633 \u062F\u062C\u0627\u062C",cuisine:"Khaleeji (Gulf)",country:"KW",blurb:"Chicken braised with baharat and dried limes, then the rice cooked in that same broth in one pot, served with a raw tomato and coriander daqoos.",servings:2,activeMin:35,totalMin:95,difficulty:"medium",items:[{ref:"chicken_thigh",grams:500,note:"bone-in if possible, skin on, cut into large pieces"},{ref:"basmati_rice",grams:250,note:"rinsed and soaked 20 min"},{ref:"onion",grams:200,note:"finely chopped"},{ref:"garlic",grams:16,note:"crushed"},{ref:"ginger",grams:15,note:"grated"},{ref:"green_chilli",grams:10,note:"slit",optional:!0},{ref:"tomato_fresh",grams:300,note:"150 g grated into the pot, 150 g for the daqoos"},{ref:"tomato_puree",grams:20},{ref:"baharat",grams:8,note:"Gulf seven-spice"},{ref:"turmeric",grams:3},{ref:"cinnamon_ground",grams:2},{ref:"cardamom_green",grams:3,note:"pods, cracked"},{ref:"cloves_whole",grams:1},{ref:"bay_leaf",grams:1},{ref:"loomi_dried_lime",grams:12,note:"2 dried limes, pierced twice with a knife"},{ref:"saffron",grams:.1,note:"steeped in 2 tbsp hot water",optional:!0},{ref:"stock_cube_chicken",grams:6,note:"half a cube \u2014 the dish is already seasoned with salt and loomi"},{ref:"water",grams:800,note:"for the braise and then the rice"},{ref:"ghee",grams:40},{ref:"vegetable_oil",grams:20},{ref:"salt",grams:7,note:"the stock cube brings its own \u2014 taste before adding the last of it"},{ref:"black_pepper",grams:2},{ref:"lemon",grams:20,note:"juice, for the daqoos"},{ref:"coriander_fresh",grams:12,note:"chopped; half for the daqoos, half to finish"},{ref:"parsley_fresh",grams:8,note:"chopped",optional:!0},{ref:"almonds",grams:20,note:"flaked and toasted, scattered over",optional:!0}],method:[{n:1,text:"Rinse the basmati until the water runs clear, then leave it to soak in cold water for 20 minutes and drain it.",minutes:22},{n:2,text:"Pat the chicken completely dry and season it with 4 g of the salt and the black pepper. Heat the vegetable oil and half the ghee in a heavy lidded casserole over medium-high heat and brown the chicken skin side down for 5 minutes, then 3 minutes on the other side. Lift it out.",minutes:10,tip:"Dry skin and a hot pan, and then do not touch it. If the chicken sticks when you try to turn it, it is not ready; it releases itself when the crust has formed."},{n:3,text:"Turn the heat to medium and cook the onion in the same fat for 10 minutes until soft and deeply golden, scraping up the browned bits from the base.",minutes:10},{n:4,text:"Add the garlic, ginger and green chilli and stir for 1 minute, then add the baharat, turmeric, cinnamon, cardamom, cloves and bay leaf and stir for a further 45 seconds.",minutes:2,tip:"The spices should smell warm and toasted, not sharp and powdery. If the pan is dry enough that they start to catch, add a splash of water rather than more heat."},{n:5,text:"Add the tomato puree and 150 g of the tomato, grated on a box grater so the skin stays in your hand. Cook for 5 minutes until the mixture darkens and thickens.",minutes:5},{n:6,text:"Return the chicken with its juices, add the pierced dried limes, the crumbled stock cube, 4 g more salt and 700 g water. Bring to a boil, then cover and simmer over low heat for 30 minutes.",minutes:33,tip:"Pierce the loomi but leave them whole. Broken open they release a bitterness that takes over the whole pot; whole and pierced, they give the sour, slightly smoky note the dish is built on."},{n:7,text:"Lift out the chicken and the dried limes onto a plate. Measure the broth left in the pot: you want 480 g of liquid for 250 g of soaked rice. Top up with water or boil it down as needed.",minutes:5,tip:"This measurement is the whole dish. Too much broth and you get a wet risotto; too little and the top layer stays hard. Use a jug, not judgement."},{n:8,text:"Return the measured broth to the pot, taste it and correct the salt so it is slightly saltier than you would want a soup. Bring it to a rolling boil, stir in the drained rice and let it boil uncovered until the liquid has dropped to the level of the rice and craters appear on the surface, about 5 minutes.",minutes:6,tip:"Season the broth now. This is the last moment the rice can take on salt, and rice seasoned afterwards always tastes of salt sitting on top rather than through it."},{n:9,text:"Sit the chicken pieces and the dried limes back on top of the rice, trickle over the saffron water and the remaining ghee, cover with a tight lid and cook on the lowest heat for 20 minutes. The chicken must reach 75 C at the thickest point.",minutes:20,tip:"If your lid is loose, lay a clean tea towel between the pot and the lid to trap the steam and catch the condensation that would otherwise drip back and make the top wet."},{n:10,text:"While it steams, make the daqoos: grate or finely chop the remaining 150 g tomato and mix it with the lemon juice, half the coriander, a crushed clove of the garlic if you saved some, and a pinch of salt.",minutes:5},{n:11,text:"Take the pot off the heat and leave it covered for 10 minutes without opening it.",minutes:10},{n:12,text:"Lift the chicken aside, fluff the rice with a fork from the edges inwards, then pile it onto a platter with the chicken on top, scattered with the remaining coriander, the parsley and the toasted almonds. Serve the daqoos in a bowl alongside.",minutes:4}],failures:[{symptom:"Rice is wet and claggy at the bottom",cause:"The broth was not measured at step 7; drain to exactly 480 g for 250 g of soaked rice, and boil off any excess before the rice goes in."},{symptom:"Whole dish tastes bitter",cause:"A dried lime split open, or the spices scorched at step 4; pierce the loomi rather than crushing them, and add a splash of water if the spice paste starts to catch."},{symptom:"Rice tastes of nothing while the chicken is well seasoned",cause:"The broth was underseasoned before the rice went in; it should taste slightly too salty on its own at step 8."},{symptom:"Chicken is dry by the time the rice is done",cause:"Boneless breast or a hard boil during the braise; use bone-in thigh and keep the simmer gentle, and set the chicken on top of the rice rather than buried in it."},{symptom:"Rice is hard on top and burnt underneath",cause:"The heat was too high during the covered stage; use the lowest possible flame, a heat diffuser if you have one, and let it rest sealed for the full 10 minutes."}],variants:[{id:"machboos_laham",label:"Machboos laham (lamb)",swaps:[{from:"chicken_thigh",to:"lamb_diced",grams:500},{from:"stock_cube_chicken",to:"stock_cube_beef",grams:10}],methodDeltas:[{step:2,change:"Brown the lamb in three small batches over high heat; crowded lamb releases water and greys instead of crusting."},{step:6,change:"Thirty minutes is nowhere near enough for lamb. Simmer covered for 70 to 80 minutes with an extra 200 g water until a cube crushes against the side of the pot."},{step:7,change:"The longer braise leaves a fattier broth; skim the surface fat off before measuring the 480 g, or the rice turns greasy."}],tags:["halal"]},{id:"machboos_samak",label:"Machboos samak (fish)",swaps:[{from:"chicken_thigh",to:"white_fish",grams:400},{from:"stock_cube_chicken",to:"stock_cube_veg",grams:10}],methodDeltas:[{step:2,change:"Dust the fillets in turmeric and salt and fry them for 2 minutes per side purely to firm the surface, then set them aside on a plate and keep them out of the pot entirely for now."},{step:6,change:"There is no meat to braise. Simmer the spiced onion base with the water, stock and dried limes for 15 minutes to build a broth, then measure it as usual."},{step:9,change:"Lay the fish on the rice only for the last 8 minutes of the covered stage, not the full 20, and do not stir it in; white fish flakes apart into nothing if it steams for longer."}],tags:["halal"]},{id:"machboos_breast_lean",label:"Leaner, with chicken breast",swaps:[{from:"chicken_thigh",to:"chicken_breast",grams:450}],methodDeltas:[{step:2,change:"Skinless breast has no fat to render; brown it for 2 minutes per side only, in oil alone, purely for colour. Halve the ghee to 20 g and save all of it for step 9. Check 75 C at the thickest point."},{step:6,change:"Simmer for 12 minutes instead of 30, then take the breast out immediately. It will finish during the rice stage and would be shredded dry after half an hour."},{step:9,change:"Return the breast for the last 10 minutes of the covered cook rather than the full 20, sitting on top of the rice where it only steams."}],tags:["halal"]},{id:"machboos_vegan",label:"Vegan, with chickpeas",swaps:[{from:"chicken_thigh",to:"chickpeas_tinned",grams:400},{from:"ghee",to:"vegetable_oil",grams:40},{from:"stock_cube_chicken",to:"stock_cube_veg",grams:10}],methodDeltas:[{step:2,change:"Nothing to brown; skip straight to the onions, but give them 14 minutes rather than 10 and let them catch properly, since the browning that the chicken skin was providing now has to come from the onion."},{step:6,change:"Simmer the broth with the dried limes for 20 minutes to build flavour, then add the drained chickpeas for the last 5 minutes only so they do not collapse."},{step:9,change:"Scatter the chickpeas over the rice before the covered stage and add 15 g more oil, because there is no rendered fat coating the grains."}],tags:["vegan","vegetarian","halal"]}],restaurantGBP:12.5,tags:["halal"]},{id:"spaghetti_carbonara",name:"Spaghetti alla Carbonara",localName:"Spaghetti alla Carbonara",cuisine:"Roman Italian",country:"IT",blurb:"Spaghetti bound in an emulsion of egg, pecorino and starchy pasta water made off the heat, with crisp guanciale and cracked black pepper. No cream.",servings:2,activeMin:20,totalMin:25,difficulty:"medium",items:[{ref:"spaghetti",grams:200},{ref:"guanciale",grams:120,note:"rind removed, cut into 5 mm thick strips"},{ref:"egg",grams:136,note:"2 whole eggs plus 2 extra yolks, at room temperature"},{ref:"pecorino",grams:60,note:"Pecorino Romano, grated as finely as you can"},{ref:"parmesan",grams:20,note:"grated, to soften the sharpness",optional:!0},{ref:"black_pepper",grams:3,note:"coarsely cracked, not fine ground"},{ref:"salt",grams:10,absorption:.1,note:"for the pasta water only \u2014 almost all of it is drained away"},{ref:"water",grams:2e3,note:"reserve 200 g of the cooking water before draining"},{ref:"olive_oil",grams:5,note:"only if the guanciale is unusually lean",optional:!0}],method:[{n:1,text:"Put 2 litres of water on to boil with the salt. Use less water than you would normally: the more concentrated the starch, the better the sauce binds.",minutes:8,tip:"Season the water lightly, around 5 g of salt per litre. Guanciale and pecorino are both very salty and there is no other stage where you can take salt out."},{n:2,text:"Put the guanciale into a cold, dry frying pan and set it over medium-low heat. Let it render slowly for 8 to 10 minutes, stirring occasionally, until the fat has run out and the strips are golden and crisp at the edges but still yielding in the middle.",minutes:10,tip:"Cold pan, low heat. Guanciale dropped into a hot pan seizes, burns on the outside and leaves its fat locked inside, and that rendered fat is a third of the sauce."},{n:3,text:"Take the pan off the heat. Lift out about a third of the crisp pieces onto a plate for the top, and leave the rest sitting in the fat.",minutes:1},{n:4,text:"Toast the cracked black pepper in a small dry pan over medium heat for 30 seconds until it smells sharp and floral, then tip it into the guanciale fat.",minutes:1},{n:5,text:"Cook the spaghetti in the boiling water for 1 minute less than the packet says, so it still has a definite bite.",minutes:9},{n:6,text:"While the pasta cooks, whisk the whole eggs and extra yolks in a large bowl with the pecorino and parmesan until you have a thick, smooth paste with no streaks of white. It should look like a loose cheese custard.",minutes:3,tip:"Whisk until the cheese has fully disappeared into the egg. Any dry pockets of pecorino will clump the moment they hit heat and you will get grit through the sauce."},{n:7,text:"Scoop out 200 g of the starchy cooking water into a mug before you drain the pasta.",minutes:1,tip:"Almost everyone forgets this and drains it all away. That cloudy water is the only thing that will hold the emulsion together."},{n:8,text:"Temper the eggs: whisking the egg and cheese mixture constantly with one hand, trickle in about 60 g of the hot pasta water with the other. The mixture will loosen and turn glossy and pourable.",minutes:2,tip:"Trickle, do not pour. Adding hot water in one go will scramble the eggs in the bowl before the pasta ever gets there."},{n:9,text:"Drain the spaghetti and tip it straight into the frying pan with the guanciale and fat, off the heat, tossing hard for 30 seconds so every strand is coated.",minutes:1},{n:10,text:"Now pour the tempered egg mixture over the pasta, still off the heat, and toss and stir continuously for about a minute. The sauce will thicken as the residual heat of the pasta cooks the egg just enough to cling.",minutes:2,tip:"The pan must be off the heat and, if it is cast iron or very heavy, off the hob entirely. Direct heat at this stage turns carbonara into spaghetti with scrambled egg in under ten seconds, and it cannot be rescued."},{n:11,text:"Judge the consistency. It should flow slowly and coat the strands like a thin custard; loosen it with the reserved water a tablespoon at a time until it does. If it is still too loose, hold the pan a few centimetres above a low flame for a few seconds at a time, stirring, and take it away between each.",minutes:1},{n:12,text:"Serve immediately into warmed bowls, top with the reserved crisp guanciale, more grated pecorino and another crack of pepper. It waits for nobody.",minutes:1,tip:"Warm the bowls under the hot tap and dry them. Cold ceramic pulls the heat out of the sauce and it stiffens into a paste on the way
