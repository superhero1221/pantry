# Netlify build settings.
#
# The routing and header rules are deliberately not here. They live in
# public/_redirects and public/_headers so that they land inside dist/, which
# is what a Netlify Drop uploads — a netlify.toml at the repo root is never
# part of a drag-and-drop deploy. This file is only what a Git-connected build
# needs to know, so that no rule has two homes to drift between.
#
# Do not add a [[headers]] block here. Netlify applies both this file and
# public/_headers, and where the two touch the same path this one wins — so a
# block added here would silently override the Content-Security-Policy without
# raising an error anywhere. Headers go in public/_headers, and their mirror
# goes in vercel.json.

# The photographs.
#
# 139 dishes ship with a drawing rather than a photograph, because the machine
# the cookbook was written on cannot reach Wikimedia — its network policy
# allows the npm registry and github.com and nothing else. Netlify's build
# servers have ordinary internet access, so connecting this repo to Netlify is
# by itself enough to fix it: the fetcher runs first and the photographs are in
# dist/ before vite is called.
#
# It adds a couple of minutes to a deploy and re-fetches each time, because a
# build cannot commit back to the repository. If you would rather pay that cost
# once, run .github/workflows/dish-photos.yml instead — that one does commit —
# and drop the `fetch-dish-photos` call from the command below.
#
# `|| true` on purpose: a Wikimedia outage should leave you with a site full of
# drawings, not a failed deploy.
[build]
  command = "node scripts/fetch-dish-photos.mjs || true && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
